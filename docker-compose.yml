name: ai-video

x-platform-environment: &platform-environment
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://ai_video:${POSTGRES_PASSWORD:-local-only-password}@postgres:5432/ai_video_platform
  AUTO_CREATE_TABLES: "false"
  # Development-only escape hatches are explicit and fail closed in Settings.
  DEVELOPMENT_HEADER_AUTH_ENABLED: ${PLATFORM_DEVELOPMENT_HEADER_AUTH_ENABLED:-true}
  ENABLE_BOOTSTRAP: ${PLATFORM_ENABLE_BOOTSTRAP:-true}
  BOOTSTRAP_TOKEN: ${PLATFORM_BOOTSTRAP_TOKEN:-local-platform-bootstrap-secret-2026-08-14}
  CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:5174","http://127.0.0.1:5174"]'
  # new-api is the only deployable Relay data plane. The Python implementation
  # remains source-only as a contract oracle and has no Compose service,
  # credential surface, network attachment, or production admission path.
  RELAY_DEFAULT_BACKEND_ID: new-api-v1
  RELAY_DEFAULT_CONTRACT_REVISION: generations.v1
  RELAY_BACKENDS: >-
    {"new-api-v1":{"base_url":"${PLATFORM_RELAY_BASE_URL:-http://relay-new-api:3000}","client_id":"${RELAY_CLIENT_ID:-customer-platform}","api_key":"${RELAY_API_KEY:-local-customer-platform-relay-key-change-me}","contract_revision":"generations.v1"}}
  RELAY_OPERATIONS_BASE_URL: ${PLATFORM_RELAY_OPERATIONS_BASE_URL:-http://relay-new-api:3000}
  # Server-owned origin for the owner-only new-api break-glass console. The
  # Platform appends /channels and never forwards browser credentials.
  RELAY_NATIVE_ADMIN_CONSOLE_ORIGIN: ${PLATFORM_RELAY_NATIVE_ADMIN_CONSOLE_ORIGIN:-}
  RELAY_TENANT_ID: ${PLATFORM_RELAY_OPERATIONS_TENANT_ID:-00000000-0000-4000-8000-000000000001}
  RELAY_OPERATIONS_TOKEN: ${PLATFORM_RELAY_OPERATIONS_TOKEN:-local-platform-relay-operations-token-change-me-03}
  RELAY_RECONCILIATION_APPROVAL_KEY_ID: ${PLATFORM_RELAY_RECONCILIATION_APPROVAL_KEY_ID:-local-platform-approval-v1}
  RELAY_RECONCILIATION_APPROVAL_SECRET: ${PLATFORM_RELAY_RECONCILIATION_APPROVAL_SECRET:-local-platform-reconciliation-approval-secret-change-me-04}
  RELAY_DISPATCH_MAX_ATTEMPTS: ${RELAY_DISPATCH_MAX_ATTEMPTS:-12}
  RELAY_CALLBACK_PUBLIC_URL: http://platform-api:8000/internal/relay-callbacks
  RELAY_CALLBACK_SIGNING_SECRETS: >-
    {"new-api-v1":"${RELAY_CALLBACK_SIGNING_SECRET:-local-relay-callback-signing-secret-change-me}"}
  TASK_QUEUED_TIMEOUT_SECONDS: ${TASK_QUEUED_TIMEOUT_SECONDS:-3600}
  TASK_PROCESSING_TIMEOUT_SECONDS: ${TASK_PROCESSING_TIMEOUT_SECONDS:-21600}
  TASK_TIMEOUT_SCAN_INTERVAL_SECONDS: ${TASK_TIMEOUT_SCAN_INTERVAL_SECONDS:-30}
  TASK_TIMEOUT_BATCH_SIZE: ${TASK_TIMEOUT_BATCH_SIZE:-100}
  PUBLISHING_WORKER_ENABLED: ${PUBLISHING_WORKER_ENABLED:-true}
  PUBLISHING_MOCK_ENABLED: ${PUBLISHING_MOCK_ENABLED:-false}
  PUBLISHING_ADAPTERS: ${PUBLISHING_ADAPTERS:-}
  PUBLISHING_OAUTH_CALLBACK_URL: ${PUBLISHING_OAUTH_CALLBACK_URL:-http://127.0.0.1:8200/api/v1/publishing/oauth/callback}
  PUBLISHING_OAUTH_SUCCESS_URL: ${PUBLISHING_OAUTH_SUCCESS_URL:-http://127.0.0.1:4173/publishing}
  PUBLISHING_OAUTH_STATE_TTL_SECONDS: ${PUBLISHING_OAUTH_STATE_TTL_SECONDS:-600}
  PUBLISHING_MEDIA_RESOLVER: ${PUBLISHING_MEDIA_RESOLVER:-}
  PUBLISHING_WORKER_POLL_INTERVAL_SECONDS: ${PUBLISHING_WORKER_POLL_INTERVAL_SECONDS:-1}
  PUBLISHING_WORKER_BATCH_SIZE: ${PUBLISHING_WORKER_BATCH_SIZE:-50}
  PUBLISHING_LEASE_SECONDS: ${PUBLISHING_LEASE_SECONDS:-60}
  PUBLISHING_MAX_ATTEMPTS: ${PUBLISHING_MAX_ATTEMPTS:-5}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-${NEW_API_RELAY_PLATFORM_INTERNAL_SERVICE_TOKEN:-local-internal-service-token-change-me-04}}
  DOWNLOAD_EDGE_COMPLETION_SERVICE_TOKEN: ${DOWNLOAD_EDGE_COMPLETION_SERVICE_TOKEN:-local-edge-completion-service-token-change-me-06}
  CHANNEL_COST_SIGNING_SECRET: ${CHANNEL_COST_SIGNING_SECRET:-${NEW_API_RELAY_PLATFORM_CHANNEL_COST_SIGNING_SECRET:-local-channel-cost-signing-secret-change-me}}
  CHANNEL_COST_SIGNATURE_REQUIRED: ${CHANNEL_COST_SIGNATURE_REQUIRED:-true}
  CHANNEL_COST_SIGNATURE_MAX_AGE_SECONDS: ${CHANNEL_COST_SIGNATURE_MAX_AGE_SECONDS:-300}
  RELAY_TELEMETRY_SIGNING_SECRET: ${RELAY_TELEMETRY_SIGNING_SECRET:-local-relay-telemetry-signing-secret-change-me-05}
  RELAY_TELEMETRY_SIGNATURE_MAX_AGE_SECONDS: ${RELAY_TELEMETRY_SIGNATURE_MAX_AGE_SECONDS:-300}
  # new-api Relay -> Platform provider-alert receipt, then Platform -> the
  # operator-owned downstream. Inbound and outbound signing keys are distinct.
  PROVIDER_ALERT_SIGNING_SECRET: ${NEW_API_RELAY_PROVIDER_ALERT_SIGNING_SECRET:-}
  PROVIDER_ALERT_SIGNATURE_MAX_AGE_SECONDS: ${PROVIDER_ALERT_SIGNATURE_MAX_AGE_SECONDS:-300}
  PROVIDER_ALERT_FORWARD_WEBHOOK_URL: ${PROVIDER_ALERT_FORWARD_WEBHOOK_URL:-}
  PROVIDER_ALERT_FORWARD_SIGNING_SECRET: ${PROVIDER_ALERT_FORWARD_SIGNING_SECRET:-}
  PROVIDER_ALERT_FORWARD_TIMEOUT_SECONDS: ${PROVIDER_ALERT_FORWARD_TIMEOUT_SECONDS:-5}
  DOWNLOAD_COMPLETION_EDGE_GATEWAY_SIGNING_SECRET: ${DOWNLOAD_COMPLETION_EDGE_GATEWAY_SIGNING_SECRET:-local-edge-download-signing-secret-change-me}
  DOWNLOAD_COMPLETION_OBS_ACCESS_LOG_SIGNING_SECRET: ${DOWNLOAD_COMPLETION_OBS_ACCESS_LOG_SIGNING_SECRET:-local-obs-download-signing-secret-change-me}
  DOWNLOAD_COMPLETION_SIGNATURE_MAX_AGE_SECONDS: ${DOWNLOAD_COMPLETION_SIGNATURE_MAX_AGE_SECONDS:-300}
  # The Platform never returns the OBS signed URL when the controlled download
  # gateway is configured. These credentials authenticate ticket registration,
  # not completion delivery, and must remain independent from every Relay key.
  # The controlled edge is part of the active new-api data plane in every
  # topology. Local defaults remain development-only; protected overlays
  # replace every credential with process-scoped secret files.
  DOWNLOAD_GATEWAY_REGISTRATION_URL: ${DOWNLOAD_GATEWAY_REGISTRATION_URL:-http://relay-download-edge:8080/internal/v1/download-tickets}
  DOWNLOAD_GATEWAY_PUBLIC_BASE_URL: ${DOWNLOAD_GATEWAY_PUBLIC_BASE_URL:-http://127.0.0.1:8400}
  DOWNLOAD_GATEWAY_SERVICE_TOKEN: ${DOWNLOAD_GATEWAY_SERVICE_TOKEN:-local-download-gateway-service-token-change-me-01}
  DOWNLOAD_GATEWAY_REGISTRATION_SIGNING_SECRET: ${DOWNLOAD_GATEWAY_REGISTRATION_SIGNING_SECRET:-local-download-gateway-registration-signing-change-me-02}
  # Development-only deterministic key. Production must inject an independent
  # cryptographically random 32-byte key encoded as canonical base64.
  DOWNLOAD_GATEWAY_ATTEMPT_ENCRYPTION_KEY_BASE64: ${DOWNLOAD_GATEWAY_ATTEMPT_ENCRYPTION_KEY_BASE64:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
  DOWNLOAD_GATEWAY_TIMEOUT_SECONDS: ${DOWNLOAD_GATEWAY_TIMEOUT_SECONDS:-10}
  DOWNLOAD_GATEWAY_REGISTRATION_WORKER_ENABLED: ${DOWNLOAD_GATEWAY_REGISTRATION_WORKER_ENABLED:-true}
  RELAY_ALLOW_LEGACY_ARTIFACT_DOWNLOAD_RESPONSE: "false"
  DOWNLOAD_GATEWAY_REGISTRATION_POLL_INTERVAL_SECONDS: ${DOWNLOAD_GATEWAY_REGISTRATION_POLL_INTERVAL_SECONDS:-1}
  DOWNLOAD_GATEWAY_REGISTRATION_BATCH_SIZE: ${DOWNLOAD_GATEWAY_REGISTRATION_BATCH_SIZE:-50}
  DOWNLOAD_GATEWAY_REGISTRATION_LEASE_SECONDS: ${DOWNLOAD_GATEWAY_REGISTRATION_LEASE_SECONDS:-30}
  DOWNLOAD_GATEWAY_REGISTRATION_LEASE_MARGIN_SECONDS: ${DOWNLOAD_GATEWAY_REGISTRATION_LEASE_MARGIN_SECONDS:-10}
  DOWNLOAD_GATEWAY_REGISTRATION_MAX_ATTEMPTS: ${DOWNLOAD_GATEWAY_REGISTRATION_MAX_ATTEMPTS:-8}
  DOWNLOAD_GATEWAY_REGISTRATION_RETRY_BASE_SECONDS: ${DOWNLOAD_GATEWAY_REGISTRATION_RETRY_BASE_SECONDS:-1}
  DOWNLOAD_GATEWAY_REGISTRATION_RETRY_CAP_SECONDS: ${DOWNLOAD_GATEWAY_REGISTRATION_RETRY_CAP_SECONDS:-60}
  DOWNLOAD_GATEWAY_TICKET_TTL_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_TICKET_TTL_SECONDS:-300}
  DOWNLOAD_GATEWAY_SOURCE_TTL_MARGIN_SECONDS: ${DOWNLOAD_GATEWAY_SOURCE_TTL_MARGIN_SECONDS:-60}
  RELAY_ARTIFACT_SIGNED_URL_TTL_SECONDS: ${NEW_API_RELAY_ARTIFACT_SIGNED_URL_TTL_SECONDS:-600}
  INPUT_ASSET_STORE: filesystem
  INPUT_ASSET_FILESYSTEM_ROOT: /input-assets
  INPUT_ASSET_PUBLIC_BASE_URL: http://127.0.0.1:${PLATFORM_HOST_PORT:-8200}
  INPUT_ASSET_RELAY_BASE_URL: http://platform-api:8000
  INPUT_ASSET_SIGNING_SECRET: ${INPUT_ASSET_SIGNING_SECRET:-local-input-asset-signing-secret-change-me}
  INPUT_ASSET_SIGNED_URL_SECONDS: ${INPUT_ASSET_SIGNED_URL_SECONDS:-300}
  INPUT_ASSET_RELAY_SIGNED_URL_SECONDS: ${INPUT_ASSET_RELAY_SIGNED_URL_SECONDS:-3600}

x-new-api-relay-build: &new-api-relay-build
  context: ./backend/new-api-relay
  args:
    RELAY_BUILD_UPSTREAM_REVISION: 0ab02020603d22e5613bc4cf46bfab06f8567769
    # Local images carry an explicit development identity so the protected
    # one-shot path exercises the same provenance gate as secure staging.
    RELAY_BUILD_SOURCE_REVISION: ${NEW_API_RELAY_SOURCE_REVISION:-1111111111111111111111111111111111111111}
    RELAY_BUILD_SOURCE_SNAPSHOT_SHA256: ${NEW_API_RELAY_SOURCE_SNAPSHOT_SHA256:-sha256:1111111111111111111111111111111111111111111111111111111111111111}
    RELAY_BUILD_SOURCE_SNAPSHOT_FILE_COUNT: ${NEW_API_RELAY_SOURCE_SNAPSHOT_FILE_COUNT:-1}
    RELAY_BUILD_ROUTE_ACCEPTANCE_KEYS_SHA256: ${NEW_API_RELAY_ROUTE_ACCEPTANCE_KEYS_SHA256:-sha256:1111111111111111111111111111111111111111111111111111111111111111}

x-new-api-relay-environment: &new-api-relay-environment
  TZ: Asia/Shanghai
  PORT: "3000"
  APP_ENV: development
  DEPLOYMENT_ENV: development
  SQL_DSN_FILE: /run/relay-local-db-secrets/relay-local-runtime-sql-dsn
  REDIS_CONN_STRING: redis://:${NEW_API_REDIS_PASSWORD:-local-new-api-redis-password}@relay-new-api-redis:6379/0
  SESSION_SECRET: ${NEW_API_SESSION_SECRET:-local-new-api-session-secret-change-me}
  CRYPTO_SECRET: ${NEW_API_CRYPTO_SECRET:-local-new-api-crypto-secret-change-me}
  NODE_TYPE: ${NEW_API_RELAY_NODE_TYPE:-master}
  NODE_NAME: ${NEW_API_RELAY_NODE_NAME:-relay-new-api-local-1}
  ERROR_LOG_ENABLED: "true"
  # Protected local PostgreSQL uses the synchronous accounting path until the
  # batch writer has a lifecycle-fenced, lossless final flush.
  BATCH_UPDATE_ENABLED: "false"
  # Codex refresh rotates upstream state before local persistence. Keep it off
  # until durable unknown-outcome/re-authentication reconciliation exists.
  RELAY_CODEX_CREDENTIAL_AUTO_REFRESH_ENABLED: "false"
  # Generic new-api provider endpoints have no durable Platform billing or
  # submission-unknown state machine. Protected Relay exposes only the
  # Platform generation contract and its fenced internal native bridge.
  RELAY_NATIVE_PAID_COMPAT_ENABLED: "false"
  UPDATE_TASK: "true"
  RELAY_COMPAT_ENABLED: "true"
  RELAY_COMPAT_ENVIRONMENT: ${NEW_API_RELAY_COMPAT_ENVIRONMENT:-development}
  RELAY_COMPAT_SOURCE_REVISION: ${NEW_API_RELAY_SOURCE_REVISION:-1111111111111111111111111111111111111111}
  RELAY_COMPAT_IMAGE_DIGEST: ${NEW_API_RELAY_IMAGE_DIGEST:-}
  RELAY_COMPAT_SOURCE_SNAPSHOT_SHA256: ${NEW_API_RELAY_SOURCE_SNAPSHOT_SHA256:-sha256:1111111111111111111111111111111111111111111111111111111111111111}
  RELAY_COMPAT_SOURCE_SNAPSHOT_FILE_COUNT: ${NEW_API_RELAY_SOURCE_SNAPSHOT_FILE_COUNT:-1}
  # The base profile is intentionally development-only. Secure overlays switch
  # this to true and install the typed A/B secret files before startup.
  RELAY_DATABASE_ROLE_ATTESTATION_REQUIRED: "false"
  RELAY_SCHEMA_OWNER_DATABASE_ROLE: ${NEW_API_RELAY_SCHEMA_OWNER_DATABASE_ROLE:-relay_schema_owner}
  RELAY_MIGRATION_DATABASE_ROLE: ${NEW_API_RELAY_MIGRATION_DATABASE_ROLE:-relay_schema_migrator}
  RELAY_RUNTIME_DATABASE_ROLE: relay_runtime
  # Development-only keyring. Secure overlays replace it with an owner-only
  # file bind and reject this inline source.
  RELAY_PROVIDER_CREDENTIAL_KEYRING_JSON: '${NEW_API_RELAY_LOCAL_PROVIDER_CREDENTIAL_KEYRING_JSON:-{"schema_version":1,"active_key_id":"local-v1","keys":{"local-v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}}}'
  # Public verification keys only. The corresponding canonical JSON digest is
  # embedded in production images; acceptance private keys never enter Relay.
  RELAY_COMPAT_ROUTE_ACCEPTANCE_PUBLIC_KEYS_JSON: '${NEW_API_RELAY_ROUTE_ACCEPTANCE_PUBLIC_KEYS_JSON:-}'
  # The compatibility client key preserves the frozen Platform contract. The
  # upstream token is a separate native new-api token provisioned in its active
  # control plane.
  RELAY_COMPAT_CLIENT_CREDENTIALS_JSON: >-
    {"${RELAY_CLIENT_ID:-customer-platform}":{"tenant_id":"${RELAY_TENANT_ID:-00000000-0000-4000-8000-000000000001}","api_key":"${RELAY_API_KEY:-local-customer-platform-relay-key-change-me}","upstream_token":"${NEW_API_CUSTOMER_PLATFORM_UPSTREAM_TOKEN:-replace-with-new-api-customer-platform-token}","callback_url":"http://platform-api:8000/internal/relay-callbacks","callback_signing_secret":"${RELAY_CALLBACK_SIGNING_SECRET:-local-relay-callback-signing-secret-change-me}"},"internal-tiktok":{"tenant_id":"${INTERNAL_TIKTOK_RELAY_TENANT_ID:-00000000-0000-4000-8000-000000000002}","api_key":"${INTERNAL_TIKTOK_RELAY_API_KEY:-local-internal-tiktok-relay-key-change-me}","upstream_token":"${NEW_API_INTERNAL_TIKTOK_UPSTREAM_TOKEN:-replace-with-new-api-internal-tiktok-token}"}}
  # SHA-256 digests of separate tenant-scoped operations tokens. These tokens
  # serve task reconciliation; only the canonical customer Platform tenant
  # below may additionally use the global, secret-free channel-control facade.
  RELAY_COMPAT_OPERATIONS_CREDENTIALS_JSON: '${NEW_API_RELAY_OPERATIONS_CREDENTIALS_JSON:-[{"tenant_id":"00000000-0000-4000-8000-000000000001","token_sha256":"56e12910b642ccd23bb552175d2e9f465dc1a696d72e05e7a5c895bdee51bd4d"}]}'
  RELAY_PLATFORM_CONTROL_TENANT_ID: ${PLATFORM_RELAY_OPERATIONS_TENANT_ID:-00000000-0000-4000-8000-000000000001}
  # A second, independent key proves the Platform approval payload. Unlike the
  # bearer-token catalog, Relay must hold this HMAC secret to verify signatures.
  RELAY_COMPAT_RECONCILIATION_APPROVAL_KEYS_JSON: '${NEW_API_RELAY_RECONCILIATION_APPROVAL_KEYS_JSON:-[{"tenant_id":"00000000-0000-4000-8000-000000000001","key_id":"local-platform-approval-v1","secret":"local-platform-reconciliation-approval-secret-change-me-04"}]}'
  # Keep both empty on first boot. After native channels exist, configure
  # exactly one source: route declarations are required for production, while
  # direct capabilities are a development-only contract harness.
  RELAY_COMPAT_MODEL_ROUTES_JSON: '${NEW_API_RELAY_MODEL_ROUTES_JSON:-}'
  RELAY_COMPAT_MODEL_CAPABILITIES_JSON: '${NEW_API_RELAY_MODEL_CAPABILITIES_JSON:-}'
  # new-api owns the default generation path, so its durable workers are active.
  # Production replaces this development token through the API secret bundle.
  RELAY_COMPAT_WORKER_ENABLED: ${NEW_API_RELAY_WORKER_ENABLED:-true}
  RELAY_COMPAT_INTERNAL_ADMISSION_TOKEN: ${NEW_API_RELAY_INTERNAL_ADMISSION_TOKEN:-local-new-api-internal-admission-token-change-me}
  RELAY_COMPAT_SUBMISSION_TIMEOUT_SECONDS: ${NEW_API_RELAY_SUBMISSION_TIMEOUT_SECONDS:-120}
