  RELAY_PROVIDER_MONITOR_ENABLED: ${NEW_API_RELAY_PROVIDER_MONITOR_ENABLED:-false}
  RELAY_PROVIDER_MONITOR_INTERVAL_SECONDS: ${NEW_API_RELAY_PROVIDER_MONITOR_INTERVAL_SECONDS:-30}
  RELAY_PROVIDER_MONITOR_LEASE_SECONDS: ${NEW_API_RELAY_PROVIDER_MONITOR_LEASE_SECONDS:-120}
