x-new-api-download-edge-environment: &new-api-download-edge-environment
  # Deliberately do not inherit x-new-api-relay-environment. The public download
  # edge must never receive Redis, tenant/channel credentials, OBS AK/SK,
  # callback, provider-monitor, alert, or channel-cost secrets. In production
  # this DSN should name a dedicated DML-only PostgreSQL role.
  RELAY_DOWNLOAD_EDGE_SQL_DSN_FILE: /run/relay-local-db-secrets/relay-local-download-edge-sql-dsn
  RELAY_DOWNLOAD_EDGE_ENVIRONMENT: ${NEW_API_RELAY_DOWNLOAD_EDGE_ENVIRONMENT:-development}
  RELAY_DATABASE_ROLE_ATTESTATION_REQUIRED: "false"
  RELAY_SCHEMA_OWNER_DATABASE_ROLE: ${NEW_API_RELAY_SCHEMA_OWNER_DATABASE_ROLE:-relay_schema_owner}
  RELAY_MIGRATION_DATABASE_ROLE: ${NEW_API_RELAY_MIGRATION_DATABASE_ROLE:-relay_schema_migrator}
  RELAY_RUNTIME_DATABASE_ROLE: relay_runtime
  RELAY_DOWNLOAD_EDGE_LISTEN_ADDRESS: ":8080"
  RELAY_DOWNLOAD_EDGE_PUBLIC_BASE_URL: ${DOWNLOAD_GATEWAY_PUBLIC_BASE_URL:-http://127.0.0.1:8400}
  # Exact comma-separated signed-URL hosts. Wildcards and arbitrary suffixes
  # are deliberately unsupported. Production accepts Huawei OBS hosts only.
  RELAY_DOWNLOAD_EDGE_ALLOWED_OBS_HOSTS: ${NEW_API_RELAY_DOWNLOAD_EDGE_ALLOWED_OBS_HOSTS:-}
  RELAY_DOWNLOAD_EDGE_REGISTRATION_TOKEN: ${DOWNLOAD_GATEWAY_SERVICE_TOKEN:-local-download-gateway-service-token-change-me-01}
  RELAY_DOWNLOAD_EDGE_REGISTRATION_SIGNING_SECRET: ${DOWNLOAD_GATEWAY_REGISTRATION_SIGNING_SECRET:-local-download-gateway-registration-signing-change-me-02}
  RELAY_DOWNLOAD_EDGE_TICKET_TOKEN_KEY_BASE64: ${NEW_API_RELAY_DOWNLOAD_EDGE_TICKET_TOKEN_KEY_BASE64:-dGlja2V0LXRva2VuLWtleS0zMi1ieXRlLXZhbHVlMDE=}
  RELAY_DOWNLOAD_EDGE_SOURCE_ENCRYPTION_KEY_BASE64: ${NEW_API_RELAY_DOWNLOAD_EDGE_SOURCE_ENCRYPTION_KEY_BASE64:-c291cmNlLWVuY3J5cHRpb24ta2V5LTMyLWJ5dGUtMDI=}
  RELAY_DOWNLOAD_EDGE_PLATFORM_COMPLETION_URL: ${NEW_API_RELAY_DOWNLOAD_EDGE_PLATFORM_COMPLETION_URL:-http://platform-api:8000/internal/artifact-download-completions/edge-gateway}
  RELAY_DOWNLOAD_EDGE_PLATFORM_INTERNAL_TOKEN: ${DOWNLOAD_EDGE_COMPLETION_SERVICE_TOKEN:-local-edge-completion-service-token-change-me-06}
  RELAY_DOWNLOAD_EDGE_COMPLETION_SIGNING_SECRET: ${DOWNLOAD_COMPLETION_EDGE_GATEWAY_SIGNING_SECRET:-local-edge-download-signing-secret-change-me}
  RELAY_DOWNLOAD_EDGE_PROOF_PRIVATE_KEY_BASE64: ${NEW_API_RELAY_DOWNLOAD_EDGE_PROOF_PRIVATE_KEY_BASE64:-cHJvb2YtcHJpdmF0ZS1zZWVkLTMyLWJ5dGVzLWtleTM=}
  RELAY_DOWNLOAD_EDGE_PROOF_KEY_ID: ${NEW_API_RELAY_DOWNLOAD_EDGE_PROOF_KEY_ID:-local-edge-proof-key-1}
  RELAY_DOWNLOAD_EDGE_PROOF_READ_TOKEN: ${NEW_API_RELAY_DOWNLOAD_EDGE_PROOF_READ_TOKEN:-local-download-proof-read-token-change-me-03}
  RELAY_DOWNLOAD_EDGE_PRODUCER_SUBJECT: ${NEW_API_RELAY_DOWNLOAD_EDGE_PRODUCER_SUBJECT:-relay-download-edge/local}
  RELAY_DOWNLOAD_EDGE_TICKET_TTL_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_TICKET_TTL_SECONDS:-300}
  RELAY_DOWNLOAD_EDGE_SOURCE_EXPIRY_MARGIN_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_SOURCE_EXPIRY_MARGIN_SECONDS:-60}
  RELAY_DOWNLOAD_EDGE_REGISTRATION_MAX_AGE_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_REGISTRATION_MAX_AGE_SECONDS:-300}
  RELAY_DOWNLOAD_EDGE_TRANSFER_TIMEOUT_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_TRANSFER_TIMEOUT_SECONDS:-300}
  RELAY_DOWNLOAD_EDGE_TRANSFER_COMPLETION_MARGIN_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_TRANSFER_COMPLETION_MARGIN_SECONDS:-10}
  RELAY_DOWNLOAD_EDGE_TICKET_CLAIM_LEASE_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_TICKET_CLAIM_LEASE_SECONDS:-330}
  RELAY_DOWNLOAD_EDGE_DELIVERY_CLAIM_LEASE_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_DELIVERY_CLAIM_LEASE_SECONDS:-60}
  RELAY_DOWNLOAD_EDGE_DELIVERY_COMMIT_MARGIN_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_DELIVERY_COMMIT_MARGIN_SECONDS:-10}
  RELAY_DOWNLOAD_EDGE_DELIVERY_POLL_SECONDS: ${NEW_API_RELAY_DOWNLOAD_EDGE_DELIVERY_POLL_SECONDS:-1}
  RELAY_DOWNLOAD_EDGE_DELIVERY_MAX_ATTEMPTS: ${NEW_API_RELAY_DOWNLOAD_EDGE_DELIVERY_MAX_ATTEMPTS:-8}
  RELAY_DOWNLOAD_EDGE_MAX_ARTIFACT_BYTES: ${NEW_API_RELAY_DOWNLOAD_EDGE_MAX_ARTIFACT_BYTES:-5368709120}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_video
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-local-databases.sql:/docker-entrypoint-initdb.d/10-ai-video-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_video -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # new-api Relay is the ordinary development data plane. The same service
  # names are hardened by the secure overlay for staging and production.
  relay-new-api-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: new_api
      POSTGRES_PASSWORD: ${NEW_API_POSTGRES_PASSWORD:-local-new-api-postgres-password-x}
      POSTGRES_DB: new_api
    volumes:
      - relay-new-api-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-new-api-database-isolation.sql:/docker-entrypoint-initdb.d/20-new-api-database-isolation.sql:ro
    networks:
      - relay-new-api-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U new_api -d new_api"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  relay-new-api-redis:
    image: redis:7-alpine
    environment:
      NEW_API_REDIS_PASSWORD: ${NEW_API_REDIS_PASSWORD:-local-new-api-redis-password}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--requirepass",
        "${NEW_API_REDIS_PASSWORD:-local-new-api-redis-password}",
      ]
    volumes:
      - relay-new-api-redis-data:/data
    networks:
      - relay-new-api-data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$NEW_API_REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The Relay image runs as uid/gid 10001. Existing named volumes may have
  # been created by an older root-running image, so repair ownership before
  # every start instead of weakening the long-lived service back to root.
  relay-new-api-volume-init:
    build: *new-api-relay-build
    image: ai-video/new-api-relay:${NEW_API_RELAY_IMAGE_TAG:-0ab0202-local}
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        chown -R 10001:10001 /data /app/logs /artifacts &&
        chmod 0700 /data /app/logs /artifacts &&
        install -d -o 10001 -g 10001 -m 0700 /run/relay-local-db-secrets &&
        for secret in relay-local-role-admin-dsn relay-local-migration-db-password
        relay-local-runtime-db-password relay-local-download-edge-db-password
        relay-local-migration-sql-dsn relay-local-runtime-sql-dsn
        relay-local-download-edge-sql-dsn; do
        test -f "/bootstrap-secrets/$$secret" &&
        install -o 10001 -g 10001 -m 0400
        "/bootstrap-secrets/$$secret" "/run/relay-local-db-secrets/$$secret";
        done
    volumes:
      - relay-new-api-runtime-data:/data
      - relay-new-api-logs:/app/logs
      - relay-new-api-artifacts:/artifacts
      - relay-new-api-local-db-secrets:/run/relay-local-db-secrets
      - ./deploy/secrets/relay-local-role-admin-dsn:/bootstrap-secrets/relay-local-role-admin-dsn:ro
      - ./deploy/secrets/relay-local-migration-db-password:/bootstrap-secrets/relay-local-migration-db-password:ro
      - ./deploy/secrets/relay-local-runtime-db-password:/bootstrap-secrets/relay-local-runtime-db-password:ro
      - ./deploy/secrets/relay-local-download-edge-db-password:/bootstrap-secrets/relay-local-download-edge-db-password:ro
      - ./deploy/secrets/relay-local-migration-sql-dsn:/bootstrap-secrets/relay-local-migration-sql-dsn:ro
      - ./deploy/secrets/relay-local-runtime-sql-dsn:/bootstrap-secrets/relay-local-runtime-sql-dsn:ro
      - ./deploy/secrets/relay-local-download-edge-sql-dsn:/bootstrap-secrets/relay-local-download-edge-sql-dsn:ro
    restart: "no"

  # The exact API image owns the privileged predecessor as a native command.
  # It derives SCRAM verifiers in memory and atomically creates the protected
  # role topology plus edge NOLOGIN/zero-ACL stub under the lifecycle lock.
  relay-new-api-db-role-pre:
    build: *new-api-relay-build
    image: ai-video/new-api-relay:${NEW_API_RELAY_IMAGE_TAG:-0ab0202-local}
    entrypoint: ["/new-api", "relay-provision-database-roles"]
    environment:
      APP_ENV: development
      DEPLOYMENT_ENV: development
      NODE_TYPE: master
      SQL_DSN_FILE: /run/relay-local-db-secrets/relay-local-role-admin-dsn
      RELAY_LOCAL_DATABASE_ROLE_REHEARSAL: "true"
      RELAY_DATABASE_ROLE_ATTESTATION_REQUIRED: "true"
      RELAY_DATABASE_TLS_ATTESTATION_REQUIRED: "false"
      RELAY_DATABASE_SECRET_FILES_REQUIRED: "false"
      RELAY_DATABASE_SECRET_FILE_MODE_REQUIRED: "true"
      RELAY_SCHEMA_OWNER_DATABASE_ROLE: ${NEW_API_RELAY_SCHEMA_OWNER_DATABASE_ROLE:-relay_schema_owner}
      RELAY_MIGRATION_DATABASE_ROLE: ${NEW_API_RELAY_MIGRATION_DATABASE_ROLE:-relay_schema_migrator}
      RELAY_RUNTIME_DATABASE_ROLE: relay_runtime
      RELAY_COMPAT_SOURCE_REVISION: ${NEW_API_RELAY_SOURCE_REVISION:-1111111111111111111111111111111111111111}
      RELAY_COMPAT_SOURCE_SNAPSHOT_SHA256: ${NEW_API_RELAY_SOURCE_SNAPSHOT_SHA256:-sha256:1111111111111111111111111111111111111111111111111111111111111111}
      RELAY_COMPAT_SOURCE_SNAPSHOT_FILE_COUNT: ${NEW_API_RELAY_SOURCE_SNAPSHOT_FILE_COUNT:-1}
      RELAY_MIGRATION_DATABASE_PASSWORD_FILE: /run/relay-local-db-secrets/relay-local-migration-db-password
      RELAY_RUNTIME_DATABASE_PASSWORD_FILE: /run/relay-local-db-secrets/relay-local-runtime-db-password
      RELAY_DOWNLOAD_EDGE_DATABASE_PASSWORD_FILE: /run/relay-local-db-secrets/relay-local-download-edge-db-password
    volumes:
      - relay-new-api-local-db-secrets:/run/relay-local-db-secrets:ro
    networks:
      - relay-new-api-data
    depends_on:
      relay-new-api-volume-init:
        condition: service_completed_successfully
      relay-new-api-postgres:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    restart: "no"

  # Schema/data change is a one-shot command in the exact API image. The
  # migrator receives neither Redis nor caller/provider/OBS credentials.
  relay-new-api-migrate:
    build: *new-api-relay-build
    image: ai-video/new-api-relay:${NEW_API_RELAY_IMAGE_TAG:-0ab0202-local}
    entrypoint: ["/new-api", "relay-migrate"]
    environment:
      APP_ENV: development
      DEPLOYMENT_ENV: development
      NODE_TYPE: master
      SQL_DSN_FILE: /run/relay-local-db-secrets/relay-local-migration-sql-dsn
      RELAY_LOCAL_DATABASE_ROLE_REHEARSAL: "true"
      RELAY_DATABASE_ROLE_ATTESTATION_REQUIRED: "true"
      RELAY_SCHEMA_OWNER_DATABASE_ROLE: ${NEW_API_RELAY_SCHEMA_OWNER_DATABASE_ROLE:-relay_schema_owner}
      RELAY_MIGRATION_DATABASE_ROLE: ${NEW_API_RELAY_MIGRATION_DATABASE_ROLE:-relay_schema_migrator}
      RELAY_RUNTIME_DATABASE_ROLE: relay_runtime
      RELAY_COMPAT_SOURCE_REVISION: ${NEW_API_RELAY_SOURCE_REVISION:-1111111111111111111111111111111111111111}
      RELAY_COMPAT_SOURCE_SNAPSHOT_SHA256: ${NEW_API_RELAY_SOURCE_SNAPSHOT_SHA256:-sha256:1111111111111111111111111111111111111111111111111111111111111111}
      RELAY_COMPAT_SOURCE_SNAPSHOT_FILE_COUNT: ${NEW_API_RELAY_SOURCE_SNAPSHOT_FILE_COUNT:-1}
      RELAY_PROVIDER_CREDENTIAL_KEYRING_JSON: '${NEW_API_RELAY_LOCAL_PROVIDER_CREDENTIAL_KEYRING_JSON:-{"schema_version":1,"active_key_id":"local-v1","keys":{"local-v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}}}'
    volumes:
      - relay-new-api-local-db-secrets:/run/relay-local-db-secrets:ro
    networks:
      - relay-new-api-data
    depends_on:
      relay-new-api-db-role-pre:
        condition: service_completed_successfully
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    restart: "no"

  # The post step never grants DML or mutates schema. It attaches the edge
  # login only after the versioned migration manifest has committed.
  relay-new-api-db-role-post:
    build: *new-api-relay-build
    image: ai-video/new-api-relay:${NEW_API_RELAY_IMAGE_TAG:-0ab0202-local}
    environment:
      APP_ENV: development
      DEPLOYMENT_ENV: development
      NODE_TYPE: master
      RELAY_LOCAL_DATABASE_ROLE_REHEARSAL: "true"
      RELAY_DATABASE_ROLE_ATTESTATION_REQUIRED: "true"
      RELAY_SCHEMA_OWNER_DATABASE_ROLE: ${NEW_API_RELAY_SCHEMA_OWNER_DATABASE_ROLE:-relay_schema_owner}
      RELAY_MIGRATION_DATABASE_ROLE: ${NEW_API_RELAY_MIGRATION_DATABASE_ROLE:-relay_schema_migrator}
      RELAY_RUNTIME_DATABASE_ROLE: relay_runtime
      RELAY_COMPAT_SOURCE_REVISION: ${NEW_API_RELAY_SOURCE_REVISION:-1111111111111111111111111111111111111111}
      RELAY_COMPAT_SOURCE_SNAPSHOT_SHA256: ${NEW_API_RELAY_SOURCE_SNAPSHOT_SHA256:-sha256:1111111111111111111111111111111111111111111111111111111111111111}
      RELAY_COMPAT_SOURCE_SNAPSHOT_FILE_COUNT: ${NEW_API_RELAY_SOURCE_SNAPSHOT_FILE_COUNT:-1}
      SQL_DSN_FILE: /run/relay-local-db-secrets/relay-local-role-admin-dsn
    entrypoint: ["/new-api", "relay-provision-edge-login"]
    command: []
    volumes:
      - relay-new-api-local-db-secrets:/run/relay-local-db-secrets:ro
    networks:
      - relay-new-api-data
    depends_on:
      relay-new-api-migrate:
        condition: service_completed_successfully
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    restart: "no"

  relay-new-api:
    build: *new-api-relay-build
    image: ai-video/new-api-relay:${NEW_API_RELAY_IMAGE_TAG:-0ab0202-local}
    labels:
      com.ai-video.relay.upstream-revision: "0ab02020603d22e5613bc4cf46bfab06f8567769"
    command: ["--log-dir", "/app/logs"]
    environment: *new-api-relay-environment
    ports:
      - "127.0.0.1:${NEW_API_RELAY_HOST_PORT:-8300}:3000"
    volumes:
      - relay-new-api-runtime-data:/data
      - relay-new-api-logs:/app/logs
      - relay-new-api-artifacts:/artifacts
      - relay-new-api-local-db-secrets:/run/relay-local-db-secrets:ro
    networks:
      - relay-new-api-edge
      - relay-new-api-data
    depends_on:
      relay-new-api-volume-init:
        condition: service_completed_successfully
      relay-new-api-postgres:
        condition: service_healthy
      relay-new-api-redis:
        condition: service_healthy
      relay-new-api-migrate:
        condition: service_completed_successfully
      relay-new-api-db-role-post:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "body=$$(wget -q -O - http://127.0.0.1:3000/health/ready) && printf '%s' \"$$body\" | grep -Eq '\"state\"[[:space:]]*:[[:space:]]*\"(healthy|degraded)\"'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    # Normal shutdown may spend up to 120s draining database workers and then
    # 120s draining HTTP. Keep Compose from SIGKILLing before locks/pools close.
    stop_grace_period: 260s
    restart: unless-stopped

  relay-download-edge:
    build: *new-api-relay-build
    image: ai-video/new-api-relay:${NEW_API_RELAY_IMAGE_TAG:-0ab0202-local}
    entrypoint: ["/relay-download-edge"]
    environment: *new-api-download-edge-environment
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    ports:
      - "127.0.0.1:${NEW_API_RELAY_DOWNLOAD_EDGE_HOST_PORT:-8400}:8080"
    volumes:
      - relay-new-api-local-db-secrets:/run/relay-local-db-secrets:ro
    networks:
      - relay-new-api-edge
      - relay-new-api-data
    depends_on:
      relay-new-api-postgres:
        condition: service_healthy
      relay-new-api:
        condition: service_healthy
      relay-new-api-db-role-post:
        condition: service_completed_successfully
      platform-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/health/ready | grep -q '\"status\"[[:space:]]*:[[:space:]]*\"ready\"'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    # Covers the edge's 15s HTTP and worker drain windows plus lock cleanup.
    stop_grace_period: 40s
    restart: unless-stopped

  platform-input-asset-init:
    build:
      context: ./backend/platform
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - chown -R app:app /input-assets && chmod 700 /input-assets
    volumes:
      - platform-input-assets:/input-assets
    restart: "no"

  platform-api:
    build:
      context: ./backend/platform
    environment: *platform-environment
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn platform_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports:
      - "127.0.0.1:${PLATFORM_HOST_PORT:-8200}:8000"
    volumes:
      - platform-input-assets:/input-assets
    networks:
      - default
      - relay-new-api-edge
    depends_on:
      postgres:
        condition: service_healthy
      relay-new-api:
        condition: service_healthy
      platform-input-asset-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  platform-dispatcher:
    build:
      context: ./backend/platform
    environment: *platform-environment
    command: ["python", "-m", "platform_api.dispatcher"]
    volumes:
      - platform-input-assets:/input-assets
    networks:
      - default
      - relay-new-api-edge
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  platform-relay-sync:
    build:
      context: ./backend/platform
    environment: *platform-environment
    command: ["python", "-m", "platform_api.relay_sync_worker"]
    networks:
      - default
      - relay-new-api-edge
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  platform-timeout-worker:
    build:
      context: ./backend/platform
    environment: *platform-environment
    command: ["python", "-m", "platform_api.timeout_worker"]
    networks:
      - default
      - relay-new-api-edge
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  platform-publishing-worker:
    build:
      context: ./backend/platform
    environment: *platform-environment
    command: ["python", "-m", "platform_api.publishing_worker"]
    volumes:
      - platform-input-assets:/input-assets
    networks:
      - default
      - relay-new-api-edge
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

  platform-download-gateway-registration-worker:
    build:
      context: ./backend/platform
    # The registration worker is always part of the active controlled-download
    # chain and never falls back to a provider or legacy Relay URL.
    environment:
      <<: *platform-environment
      DOWNLOAD_GATEWAY_REGISTRATION_URL: ${DOWNLOAD_GATEWAY_REGISTRATION_URL:-http://relay-download-edge:8080/internal/v1/download-tickets}
      DOWNLOAD_GATEWAY_PUBLIC_BASE_URL: ${DOWNLOAD_GATEWAY_PUBLIC_BASE_URL:-http://127.0.0.1:8400}
      DOWNLOAD_GATEWAY_SERVICE_TOKEN: ${DOWNLOAD_GATEWAY_SERVICE_TOKEN:-local-download-gateway-service-token-change-me-01}
      DOWNLOAD_GATEWAY_REGISTRATION_SIGNING_SECRET: ${DOWNLOAD_GATEWAY_REGISTRATION_SIGNING_SECRET:-local-download-gateway-registration-signing-change-me-02}
      DOWNLOAD_GATEWAY_REGISTRATION_WORKER_ENABLED: "true"
    command:
      ["python", "-m", "platform_api.download_gateway_registration_worker"]
    networks:
      - default
      - relay-new-api-edge
    depends_on:
      platform-api:
        condition: service_healthy
      relay-download-edge:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/platform-api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8180}:8080"
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  platform-input-assets:
  relay-new-api-postgres-data:
  relay-new-api-redis-data:
  relay-new-api-runtime-data:
  relay-new-api-logs:
  relay-new-api-artifacts:
  relay-new-api-local-db-secrets:

networks:
  relay-new-api-edge:
  relay-new-api-data:
    internal: true
