  RELAY_ARTIFACT_SIGNED_URL_TTL_SECONDS: ${NEW_API_RELAY_ARTIFACT_SIGNED_URL_TTL_SECONDS:-600}
  HUAWEI_OBS_ENDPOINT: ${HUAWEI_OBS_ENDPOINT:-}
  HUAWEI_OBS_BUCKET: ${HUAWEI_OBS_BUCKET:-}
  HUAWEI_OBS_ACCESS_KEY_ID: ${HUAWEI_OBS_ACCESS_KEY_ID:-}
  HUAWEI_OBS_SECRET_ACCESS_KEY: ${HUAWEI_OBS_SECRET_ACCESS_KEY:-}
  HUAWEI_OBS_SECURITY_TOKEN: ${HUAWEI_OBS_SECURITY_TOKEN:-}
  # Provider monitoring and external delivery remain disabled for an empty
