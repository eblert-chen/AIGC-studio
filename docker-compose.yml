  RELAY_COMPAT_DELAY_QUEUE_RECOVERY_BATCH: ${NEW_API_RELAY_DELAY_QUEUE_RECOVERY_BATCH:-256}
  RELAY_PROVIDER_FAILURE_THRESHOLD: ${NEW_API_RELAY_PROVIDER_FAILURE_THRESHOLD:-3}
  RELAY_PROVIDER_COOLDOWN_SECONDS: ${NEW_API_RELAY_PROVIDER_COOLDOWN_SECONDS:-30}
  RELAY_ARTIFACT_STORE: ${NEW_API_RELAY_ARTIFACT_STORE:-filesystem}
  RELAY_ARTIFACT_FILESYSTEM_ROOT: /artifacts
  RELAY_ARTIFACT_PUBLIC_BASE_URL: http://127.0.0.1:${NEW_API_RELAY_HOST_PORT:-8300}
  RELAY_ARTIFACT_SIGNING_SECRET: ${NEW_API_RELAY_ARTIFACT_SIGNING_SECRET:-local-new-api-artifact-signing-secret-change-me}
  RELAY_ARTIFACT_MAX_BYTES: ${NEW_API_RELAY_ARTIFACT_MAX_BYTES:-536870912}
  RELAY_ARTIFACT_TIMEOUT_SECONDS: ${NEW_API_RELAY_ARTIFACT_TIMEOUT_SECONDS:-60}
  # The source URL must outlive a 300s Gateway ticket plus registration/retry
