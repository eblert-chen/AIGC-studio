# Docker Compose can replace the platform container without recreating this
# gateway. Resolve the service name continuously so Nginx never keeps a stale
# container address after a deploy.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream platform_api {
    zone platform_api 64k;
    server platform-api:8000 resolve;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # Must stay aligned with the platform's default INPUT_ASSET_MAX_BYTES.
    client_max_body_size 512m;

    proxy_connect_timeout 5s;
    proxy_send_timeout 600s;
    proxy_read_timeout 60s;

    location ~ ^/health(?:/.*)?$ {
        proxy_pass http://platform_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The trusted-edge real_ip policy has already reduced the incoming
        # chain to one verified address. Never forward a caller-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
    }

    # OIDC authorization codes and state arrive in this callback query string.
    # Neither the normal access log nor routine upstream-error diagnostics may
    # persist those one-shot capabilities. Token-free login outcome evidence is
    # emitted by the Platform security-event ledger instead.
    location = /api/v1/auth/callback {
        access_log off;
        error_log /dev/stderr crit;

        proxy_pass http://platform_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;

        add_header X-Request-Id $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
    }

    location /api/ {
        proxy_pass http://platform_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;

        add_header X-Request-Id $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Exact machine-to-machine ingress required by the production Relay. The
    # Platform remains the authentication authority for callback HMAC,
    # internal-service token, alert/cost/telemetry signatures, timestamps and
    # immutable event ids. Never replace this anchored allowlist with a broad
    # /internal proxy.
    # Quote the regex: unquoted `{0,63}` is parsed by nginx as configuration
    # syntax instead of a PCRE quantifier and prevents the gateway starting.
    location ~ "^(?:/internal/relay-callbacks|/internal/relay-callbacks/[a-z0-9][a-z0-9._-]{0,63}|/internal/relay/provider-alerts|/internal/channel-costs|/internal/relay/task-stages|/internal/relay/operations-snapshots|/internal/artifact-download-completions/edge-gateway)$" {
        proxy_pass http://platform_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $http_x_request_id;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # All other internal endpoints stay unreachable through the customer and
    # Relay ingress, even if Platform adds another /internal route later.
    location /internal/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        return 404;
    }

    # This public gateway exposes only the customer Platform contract and the
    # exact signed Relay ingress above. Relay `/v1/*` and every other internal
    # endpoint must not fall through to a static-file handler or its error log.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        return 404;
    }
}
