  # passwords, never the API/worker bundles that contain unrelated credentials.
  platform-db-role-pre:
    profiles: !reset []
    build: !reset null
    image: ${PLATFORM_IMAGE:?set immutable Platform image reference with sha256 digest}
    user: "10001:10001"
    command: ["python", "-m", "platform_api.database_role_pre"]
    environment:
      <<: *relay-secret-isolation-audience
      ENVIRONMENT: ${RELAY_DEPLOYMENT_ENV:?set staging or production}
      PLATFORM_PROTECTED_RUNTIME: "true"
      PLATFORM_PROCESS_ROLE: database-role-pre
      PLATFORM_DATABASE_NAME: ${PLATFORM_DATABASE_NAME:?set canonical Platform application database name}
      PLATFORM_DATABASE_ROLE_VALID_UNTIL: ${PLATFORM_DATABASE_ROLE_VALID_UNTIL:?set canonical UTC role credential expiry}
      PLATFORM_LEGACY_DATABASE_OWNER: ${PLATFORM_LEGACY_DATABASE_OWNER:-}
      PLATFORM_DATABASE_ROLE_ADMIN_DSN_FILE: /run/secrets/platform-role-admin-sql-dsn
      PLATFORM_MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/platform-migration-database-password
      PLATFORM_API_DATABASE_PASSWORD_FILE: /run/secrets/platform-api-database-password
      PLATFORM_DISPATCHER_DATABASE_PASSWORD_FILE: /run/secrets/platform-dispatcher-database-password
