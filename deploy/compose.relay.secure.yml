    build: !reset null
    image: ${NEW_API_RELAY_IMAGE_REPOSITORY:?set immutable new-api image repository}@${NEW_API_RELAY_IMAGE_DIGEST:?set sha256 image manifest digest}
    environment: !override
      <<: *relay-secret-isolation-audience
      APP_ENV: ${RELAY_DEPLOYMENT_ENV:?set staging or production}
      DEPLOYMENT_ENV: ${RELAY_DEPLOYMENT_ENV:?set staging or production}
      SQL_DSN_FILE: /run/secrets/relay-runtime-sql-dsn
      RELAY_DATABASE_CA_FILE: /run/secrets/relay-database-ca.pem
      RELAY_REDIS_TLS_CA_FILE: /run/secrets/relay-redis-tls-ca.pem
      RELAY_DATABASE_RELEASE_PROOF_FILE: /run/relay-database-release-proof/receipt.json
      RELAY_SERVICE_PRINCIPALS_FILE: /run/secrets/relay-service-principals.json
      RELAY_API_RUNTIME_SECRETS_FILE: /run/secrets/relay-api-runtime-secrets.json
      RELAY_DATABASE_ROLE_ATTESTATION_REQUIRED: "true"
      RELAY_DATABASE_TLS_ATTESTATION_REQUIRED: "true"
      RELAY_DATABASE_SECRET_FILES_REQUIRED: "true"
      RELAY_DATABASE_SECRET_FILE_MODE_REQUIRED: "true"
      RELAY_SCHEMA_OWNER_DATABASE_ROLE: ${NEW_API_RELAY_SCHEMA_OWNER_DATABASE_ROLE:?set protected NOLOGIN schema owner}
      RELAY_MIGRATION_DATABASE_ROLE: ${NEW_API_RELAY_MIGRATION_DATABASE_ROLE:?set migration login role}
      RELAY_RUNTIME_DATABASE_ROLE: relay_runtime
      DEBUG: "false"
      DIFY_DEBUG: "false"
      GIN_MODE: release
      # These legacy background writers are not lifecycle-fenced. Secure Relay
      # uses synchronous accounting writes and rejects Codex channels until the
      # refresh/rotation flow has durable unknown-outcome reconciliation.
      BATCH_UPDATE_ENABLED: "false"
      RELAY_CODEX_CREDENTIAL_AUTO_REFRESH_ENABLED: "false"
      RELAY_NATIVE_PAID_COMPAT_ENABLED: "false"
      # Provider KEKs never enter Compose environment or the image. The file
      # contains only versioned AES-256 keys and is also mounted into the
      # one-shot migrator so legacy plaintext conversion is atomic.
      RELAY_PROVIDER_CREDENTIAL_KEYRING_FILE: /run/secrets/relay-provider-credential-keyring
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: ${NEW_API_RELAY_PUBLIC_BASE_URL:?set public HTTPS new-api root},${PLATFORM_RELAY_NATIVE_ADMIN_CONSOLE_ORIGIN:?set protected HTTPS new-api administrator origin}
      NODE_TYPE: master
      NODE_NAME: ${NEW_API_RELAY_NODE_NAME:?set stable unique node name}
      RELAY_COMPAT_ENABLED: "true"
      RELAY_COMPAT_ENVIRONMENT: ${RELAY_DEPLOYMENT_ENV:?set staging or production}
      RELAY_COMPAT_SOURCE_REVISION: ${NEW_API_RELAY_SOURCE_REVISION:?set committed extension-fork revision}
      RELAY_COMPAT_IMAGE_DIGEST: ${NEW_API_RELAY_IMAGE_DIGEST:?set deployed manifest digest}
      RELAY_COMPAT_SOURCE_SNAPSHOT_SHA256: ${NEW_API_RELAY_SOURCE_SNAPSHOT_SHA256:?set frozen source snapshot digest}
      RELAY_COMPAT_SOURCE_SNAPSHOT_FILE_COUNT: ${NEW_API_RELAY_SOURCE_SNAPSHOT_FILE_COUNT:?set frozen source snapshot file count}
      RELAY_COMPAT_UPSTREAM_REVISION: 0ab02020603d22e5613bc4cf46bfab06f8567769
      RELAY_COMPAT_ROUTE_ACCEPTANCE_TRUST_KEYS_SHA256: ${NEW_API_RELAY_ROUTE_ACCEPTANCE_KEYS_SHA256:?set frozen route-acceptance trust digest}
      PLATFORM_IMAGE: ${PLATFORM_IMAGE:?set immutable Platform image reference with sha256 digest}
      PLATFORM_SOURCE_REVISION: ${PLATFORM_SOURCE_REVISION:?set committed Platform source revision}
      PLATFORM_SOURCE_SNAPSHOT_SHA256: ${PLATFORM_SOURCE_SNAPSHOT_SHA256:?set frozen Platform source snapshot digest}
      RELAY_SECRET_ISOLATION_RECEIPT_FILE: /run/relay-secret-isolation/receipt.json
      RELAY_SECRET_ISOLATION_COMMIT_FILE: /run/relay-secret-isolation-commit/receipt.json
      RELAY_COMPAT_ROUTE_ACCEPTANCE_PUBLIC_KEYS_JSON: ${NEW_API_RELAY_ROUTE_ACCEPTANCE_PUBLIC_KEYS_JSON:?set release-pinned Ed25519 public verification keys}
      # Global channel control is not a capability of every operations tenant.
      # It is pinned to the canonical customer Platform identity.
      RELAY_PLATFORM_CONTROL_TENANT_ID: ${RELAY_TENANT_ID:?set canonical Platform tenant UUID}
      RELAY_COMPAT_MODEL_ROUTES_JSON: ${NEW_API_RELAY_MODEL_ROUTES_JSON:?set approved secret-free production routes}
      RELAY_COMPAT_MODEL_CAPABILITIES_JSON: ""
      RELAY_COMPAT_WORKER_ENABLED: "true"
      RELAY_COMPAT_DELAY_QUEUE_NAMESPACE: ${NEW_API_RELAY_DELAY_QUEUE_NAMESPACE:?set environment-specific queue namespace}
      RELAY_ARTIFACT_STORE: huawei_obs
      HUAWEI_OBS_ENDPOINT: ${NEW_API_RELAY_HUAWEI_OBS_ENDPOINT:?set official Relay Huawei OBS HTTPS endpoint}
      HUAWEI_OBS_BUCKET: ${NEW_API_RELAY_HUAWEI_OBS_BUCKET:?set Relay Huawei OBS bucket}
      RELAY_PROVIDER_MONITOR_ENABLED: "true"
      RELAY_PROVIDER_MONITOR_INTERVAL_SECONDS: ${NEW_API_RELAY_PROVIDER_MONITOR_INTERVAL_SECONDS:?set provider monitor interval}
      RELAY_PROVIDER_MONITOR_LEASE_SECONDS: ${NEW_API_RELAY_PROVIDER_MONITOR_LEASE_SECONDS:?set provider monitor lease}
      RELAY_PROVIDER_MONITOR_ACQUIRE_RETRY_SECONDS: ${NEW_API_RELAY_PROVIDER_MONITOR_ACQUIRE_RETRY_SECONDS:?set monitor acquire retry}
      RELAY_PROVIDER_HEALTHCHECK_TIMEOUT_SECONDS: ${NEW_API_RELAY_PROVIDER_HEALTHCHECK_TIMEOUT_SECONDS:?set provider probe timeout}
      RELAY_PROVIDER_CHANNEL_TEST_MAX_AGE_SECONDS: ${NEW_API_RELAY_PROVIDER_CHANNEL_TEST_MAX_AGE_SECONDS:?set maximum native channel test age}
      CHANNEL_TEST_ENABLED: "true"
      CHANNEL_TEST_FREQUENCY: ${NEW_API_RELAY_CHANNEL_TEST_FREQUENCY:?set positive channel-test minutes}
      RELAY_PROVIDER_MONITOR_WINDOW_SECONDS: ${NEW_API_RELAY_PROVIDER_MONITOR_WINDOW_SECONDS:?set provider outcome window}
      RELAY_PROVIDER_MONITOR_MIN_OUTCOMES: ${NEW_API_RELAY_PROVIDER_MONITOR_MIN_OUTCOMES:?set minimum outcome count}
      RELAY_PROVIDER_MONITOR_MIN_SUCCESS_RATE: ${NEW_API_RELAY_PROVIDER_MONITOR_MIN_SUCCESS_RATE:?set breach threshold}
      RELAY_PROVIDER_MONITOR_SUCCESS_RECOVERY_RATE: ${NEW_API_RELAY_PROVIDER_MONITOR_SUCCESS_RECOVERY_RATE:?set recovery threshold}
      RELAY_PROVIDER_MONITOR_WIDESPREAD_FAILURE_RATIO: ${NEW_API_RELAY_PROVIDER_MONITOR_WIDESPREAD_FAILURE_RATIO:?set widespread failure ratio}
      RELAY_PROVIDER_MONITOR_WIDESPREAD_RECOVERY_RATIO: ${NEW_API_RELAY_PROVIDER_MONITOR_WIDESPREAD_RECOVERY_RATIO:?set widespread recovery ratio}
      RELAY_PROVIDER_MONITOR_WIDESPREAD_MIN_ROUTES: ${NEW_API_RELAY_PROVIDER_MONITOR_WIDESPREAD_MIN_ROUTES:?set minimum route population}
      RELAY_PROVIDER_MONITOR_BATCH_DISABLED_THRESHOLD: ${NEW_API_RELAY_PROVIDER_MONITOR_BATCH_DISABLED_THRESHOLD:?set batch invalidation threshold}
      RELAY_PROVIDER_ALERT_WEBHOOK_URL: ${NEW_API_RELAY_PROVIDER_ALERT_WEBHOOK_URL:?set public HTTPS Platform alert receiver}
      RELAY_PROVIDER_ALERT_CLAIM_LEASE_SECONDS: ${NEW_API_RELAY_PROVIDER_ALERT_CLAIM_LEASE_SECONDS:?set alert delivery lease}
      RELAY_PROVIDER_ALERT_POLL_SECONDS: ${NEW_API_RELAY_PROVIDER_ALERT_POLL_SECONDS:?set alert delivery poll}
      RELAY_PLATFORM_CHANNEL_COST_URL: ${NEW_API_RELAY_PLATFORM_CHANNEL_COST_URL:?set public HTTPS Platform cost receiver}
      RELAY_PROVIDER_CONTRACT_RATES_JSON: ${NEW_API_RELAY_PROVIDER_CONTRACT_RATES_JSON:?set versioned evidence-backed contract rates}
      RELAY_CHANNEL_COST_CLAIM_LEASE_SECONDS: ${NEW_API_RELAY_CHANNEL_COST_CLAIM_LEASE_SECONDS:?set cost delivery lease}
      RELAY_CHANNEL_COST_POLL_SECONDS: ${NEW_API_RELAY_CHANNEL_COST_POLL_SECONDS:?set cost delivery poll}
      RELAY_PLATFORM_TASK_STAGE_URL: ${NEW_API_RELAY_PLATFORM_TASK_STAGE_URL:?set public HTTPS Platform task-stage receiver}
      RELAY_PLATFORM_OPERATIONS_SNAPSHOT_URL: ${NEW_API_RELAY_PLATFORM_OPERATIONS_SNAPSHOT_URL:?set public HTTPS Platform operations receiver}
      RELAY_TELEMETRY_CLAIM_LEASE_SECONDS: ${NEW_API_RELAY_TELEMETRY_CLAIM_LEASE_SECONDS:?set telemetry delivery lease}
      RELAY_TELEMETRY_POLL_SECONDS: ${NEW_API_RELAY_TELEMETRY_POLL_SECONDS:?set telemetry delivery poll}
    volumes:
      - type: bind
        source: ${NEW_API_RELAY_DATABASE_CA_FILE:?set owner-only Relay PostgreSQL CA bundle}
        target: /run/secrets/relay-database-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_REDIS_TLS_CA_FILE:?set owner-only Relay Redis TLS CA bundle}
        target: /run/secrets/relay-redis-tls-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_RUNTIME_SQL_DSN_FILE:?set owner-only runtime PostgreSQL DSN file}
        target: /run/secrets/relay-runtime-sql-dsn
        read_only: true
        bind:
          create_host_path: false
      - relay-new-api-secret-isolation-api:/run/relay-secret-isolation:ro
      - relay-new-api-secret-isolation-commit:/run/relay-secret-isolation-commit:ro
      - relay-new-api-database-release-proof:/run/relay-database-release-proof:ro
      - type: bind
        source: ${NEW_API_RELAY_PROVIDER_CREDENTIAL_KEYRING_FILE:?set host path to provider credential keyring file}
        target: /run/secrets/relay-provider-credential-keyring
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_SERVICE_PRINCIPALS_FILE:?set owner-only service principal identity file}
        target: /run/secrets/relay-service-principals.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_API_RUNTIME_SECRETS_FILE:?set owner-only API runtime secret file}
        target: /run/secrets/relay-api-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
    depends_on: !override
      relay-new-api-volume-init:
        condition: service_completed_successfully
      relay-new-api-migrate:
        condition: service_completed_successfully
      relay-new-api-db-role-post:
        condition: service_completed_successfully
      relay-new-api-service-principal-provision:
        condition: service_completed_successfully
    networks: !override
      - relay-new-api-edge
      - relay-new-api-data
      - relay-new-api-managed-state
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    stop_grace_period: 260s
    healthcheck:
      # HTTP 503 remains unavailable. HTTP 200 healthy/degraded is serviceable:
      # provider-only incidents must not restart the API or block reconciliation.
      test:
        - CMD-SHELL
        - >-
          body=$$(wget -q -O - http://127.0.0.1:3000/health/ready) &&
          printf '%s' "$$body" |
          grep -Eq '^[[:space:]]*\{[[:space:]]*"state"[[:space:]]*:[[:space:]]*"(healthy|degraded)"'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

