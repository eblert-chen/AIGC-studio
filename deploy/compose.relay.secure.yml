  # the ordinary validator above to produce a proof-present generation.
  relay-new-api-secret-isolation-pre-root:
    profiles: ["relay-root-provision"]
    extends:
      service: relay-new-api-secret-isolation
    environment:
      RELAY_SECRET_ISOLATION_GENERATION: pre-root

