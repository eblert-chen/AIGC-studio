name: ai-video-new-api-secure

x-relay-secret-isolation-audience: &relay-secret-isolation-audience
  PLATFORM_PUBLIC_BASE_URL: ${PLATFORM_PUBLIC_BASE_URL:?set canonical public Platform origin}
  NEW_API_RELAY_PUBLIC_BASE_URL: ${NEW_API_RELAY_PUBLIC_BASE_URL:?set canonical public new-api origin}
  DOWNLOAD_GATEWAY_PUBLIC_BASE_URL: ${DOWNLOAD_GATEWAY_PUBLIC_BASE_URL:?set canonical public download-edge origin}
  PLATFORM_NEW_API_RELAY_CONTRACT_REVISION: generations.v1

# Shared staging/production hardening layer. Always combine this file with
# exactly one environment overlay below. The ordinary and protected topologies
# share the same single new-api Relay data-plane service names.
services:
  # Production state is managed outside Compose. These containers are useful
  # only for an operator-owned secure-state rehearsal and never start by
  # default with this topology.
  postgres:
    profiles: ["secure-state-rehearsal"]
  redis:
    profiles: ["secure-state-rehearsal"]
  relay-new-api-postgres:
    profiles: ["secure-state-rehearsal"]
  relay-new-api-redis:
    profiles: ["secure-state-rehearsal"]
  platform-input-asset-init:
    profiles: ["secure-state-rehearsal"]

  relay-new-api-volume-init:
    profiles: !reset []
    build: !reset null
    image: ${NEW_API_RELAY_IMAGE_REPOSITORY:?set immutable new-api image repository}@${NEW_API_RELAY_IMAGE_DIGEST:?set sha256 image manifest digest}
    command: !override
      - >-
        if [ -L /run/relay-root-secret-isolation-proof/.proof.lock ]; then exit 1;
        elif [ ! -e /run/relay-root-secret-isolation-proof/.proof.lock ]; then
        (umask 077 && : > /run/relay-root-secret-isolation-proof/.proof.lock); fi &&
        test -f /run/relay-root-secret-isolation-proof/.proof.lock &&
        chown -R 10001:10001 /data /app/logs /artifacts
        /run/relay-secret-isolation/pre
        /run/relay-secret-isolation/migrate
        /run/relay-secret-isolation/post
        /run/relay-secret-isolation/principal
        /run/relay-secret-isolation/api
        /run/relay-secret-isolation/edge
        /run/relay-secret-isolation/platform-migration
        /run/relay-secret-isolation/platform-api
        /run/relay-secret-isolation/platform-dispatcher
        /run/relay-secret-isolation/platform-relay-sync
        /run/relay-secret-isolation/platform-timeout-worker
        /run/relay-secret-isolation/platform-publishing-worker
        /run/relay-secret-isolation/platform-download-gateway-registration-worker
        /run/relay-secret-isolation/platform-db-role-pre
        /run/relay-secret-isolation/root-bootstrap
        /run/relay-root-secret-isolation-proof
        /run/relay-database-release-proof
        /run/platform-database-release-proof
        /run/relay-secret-isolation-commit &&
        chmod 0600 /run/relay-root-secret-isolation-proof/.proof.lock &&
        chmod 0700 /data /app/logs /artifacts
        /run/relay-secret-isolation/pre
        /run/relay-secret-isolation/migrate
        /run/relay-secret-isolation/post
        /run/relay-secret-isolation/principal
        /run/relay-secret-isolation/api
        /run/relay-secret-isolation/edge
        /run/relay-secret-isolation/platform-migration
        /run/relay-secret-isolation/platform-api
        /run/relay-secret-isolation/platform-dispatcher
        /run/relay-secret-isolation/platform-relay-sync
        /run/relay-secret-isolation/platform-timeout-worker
        /run/relay-secret-isolation/platform-publishing-worker
        /run/relay-secret-isolation/platform-download-gateway-registration-worker
        /run/relay-secret-isolation/platform-db-role-pre
        /run/relay-secret-isolation/root-bootstrap
        /run/relay-root-secret-isolation-proof
        /run/relay-database-release-proof
        /run/platform-database-release-proof
        /run/relay-secret-isolation-commit
    volumes: !override
      - relay-new-api-runtime-data:/data
      - relay-new-api-logs:/app/logs
      - relay-new-api-artifacts:/artifacts
      - relay-new-api-secret-isolation-pre:/run/relay-secret-isolation/pre
      - relay-new-api-secret-isolation-migrate:/run/relay-secret-isolation/migrate
      - relay-new-api-secret-isolation-post:/run/relay-secret-isolation/post
      - relay-new-api-secret-isolation-principal:/run/relay-secret-isolation/principal
      - relay-new-api-secret-isolation-api:/run/relay-secret-isolation/api
      - relay-new-api-secret-isolation-edge:/run/relay-secret-isolation/edge
      - relay-new-api-secret-isolation-platform-migration:/run/relay-secret-isolation/platform-migration
      - relay-new-api-secret-isolation-platform-api:/run/relay-secret-isolation/platform-api
      - relay-new-api-secret-isolation-platform-dispatcher:/run/relay-secret-isolation/platform-dispatcher
      - relay-new-api-secret-isolation-platform-relay-sync:/run/relay-secret-isolation/platform-relay-sync
      - relay-new-api-secret-isolation-platform-timeout-worker:/run/relay-secret-isolation/platform-timeout-worker
      - relay-new-api-secret-isolation-platform-publishing-worker:/run/relay-secret-isolation/platform-publishing-worker
      - relay-new-api-secret-isolation-platform-download-gateway-registration-worker:/run/relay-secret-isolation/platform-download-gateway-registration-worker
      - relay-new-api-secret-isolation-platform-db-role-pre:/run/relay-secret-isolation/platform-db-role-pre
      - relay-new-api-secret-isolation-root-bootstrap:/run/relay-secret-isolation/root-bootstrap
      - relay-new-api-root-secret-isolation-proof:/run/relay-root-secret-isolation-proof
      - relay-new-api-database-release-proof:/run/relay-database-release-proof
      - platform-database-release-proof:/run/platform-database-release-proof
      - relay-new-api-secret-isolation-commit:/run/relay-secret-isolation-commit

  # This networkless one-shot sees every new-api secret source exactly once,
  # rejects cross-domain reuse, and writes a release/source/file-bound
  # commitment into fourteen isolated receipt volumes, then atomically commits
  # one shared value-free run marker. Each downstream consumer
  # mounts only its own receipt; no long-lived process receives the global
  # secret set or another consumer's commitments.
  relay-new-api-secret-isolation:
    profiles: !reset []
    build: !reset null
    image: ${NEW_API_RELAY_IMAGE_REPOSITORY:?set immutable new-api image repository}@${NEW_API_RELAY_IMAGE_DIGEST:?set sha256 image manifest digest}
    entrypoint: !override ["/new-api", "relay-validate-secret-isolation"]
    command: !reset []
    environment: !override
      <<: *relay-secret-isolation-audience
      RELAY_PROVIDER_ALERT_WEBHOOK_URL: ${NEW_API_RELAY_PROVIDER_ALERT_WEBHOOK_URL:?set exact Platform provider-alert receiver}
      RELAY_PLATFORM_CHANNEL_COST_URL: ${NEW_API_RELAY_PLATFORM_CHANNEL_COST_URL:?set exact Platform channel-cost receiver}
      RELAY_PLATFORM_TASK_STAGE_URL: ${NEW_API_RELAY_PLATFORM_TASK_STAGE_URL:?set exact Platform task-stage receiver}
      RELAY_PLATFORM_OPERATIONS_SNAPSHOT_URL: ${NEW_API_RELAY_PLATFORM_OPERATIONS_SNAPSHOT_URL:?set exact Platform operations-snapshot receiver}
      RELAY_DOWNLOAD_EDGE_PUBLIC_BASE_URL: ${DOWNLOAD_GATEWAY_PUBLIC_BASE_URL:?set canonical public download-edge origin}
      RELAY_DOWNLOAD_EDGE_PLATFORM_COMPLETION_URL: ${NEW_API_RELAY_DOWNLOAD_EDGE_PLATFORM_COMPLETION_URL:?set exact Platform completion receiver}
      DOWNLOAD_GATEWAY_REGISTRATION_URL: ${DOWNLOAD_GATEWAY_REGISTRATION_URL:?set exact download-edge registration endpoint}
      APP_ENV: ${RELAY_DEPLOYMENT_ENV:?set staging or production}
      DEPLOYMENT_ENV: ${RELAY_DEPLOYMENT_ENV:?set staging or production}
      NODE_TYPE: master
      RELAY_DATABASE_ROLE_ATTESTATION_REQUIRED: "true"
      RELAY_DATABASE_TLS_ATTESTATION_REQUIRED: "true"
      RELAY_SECRET_ISOLATION_GENERATION: root-proof-present
      RELAY_ROOT_SECRET_ISOLATION_PROOF_FILE: /run/relay-root-secret-isolation-proof/proof.json
      RELAY_SCHEMA_OWNER_DATABASE_ROLE: ${NEW_API_RELAY_SCHEMA_OWNER_DATABASE_ROLE:?set protected NOLOGIN schema owner}
      RELAY_MIGRATION_DATABASE_ROLE: ${NEW_API_RELAY_MIGRATION_DATABASE_ROLE:?set migration login role}
      RELAY_COMPAT_IMAGE_DIGEST: ${NEW_API_RELAY_IMAGE_DIGEST:?set deployed manifest digest}
      RELAY_COMPAT_SOURCE_REVISION: ${NEW_API_RELAY_SOURCE_REVISION:?set committed extension-fork revision}
      RELAY_COMPAT_SOURCE_SNAPSHOT_SHA256: ${NEW_API_RELAY_SOURCE_SNAPSHOT_SHA256:?set frozen source snapshot digest}
      RELAY_COMPAT_SOURCE_SNAPSHOT_FILE_COUNT: ${NEW_API_RELAY_SOURCE_SNAPSHOT_FILE_COUNT:?set frozen source snapshot file count}
      RELAY_COMPAT_UPSTREAM_REVISION: 0ab02020603d22e5613bc4cf46bfab06f8567769
      RELAY_COMPAT_ROUTE_ACCEPTANCE_TRUST_KEYS_SHA256: ${NEW_API_RELAY_ROUTE_ACCEPTANCE_KEYS_SHA256:?set frozen route-acceptance trust digest}
      PLATFORM_IMAGE: ${PLATFORM_IMAGE:?set immutable Platform image reference with sha256 digest}
      PLATFORM_SOURCE_REVISION: ${PLATFORM_SOURCE_REVISION:?set committed Platform source revision}
      PLATFORM_SOURCE_SNAPSHOT_SHA256: ${PLATFORM_SOURCE_SNAPSHOT_SHA256:?set frozen Platform source snapshot digest}
      PLATFORM_DATABASE_NAME: ${PLATFORM_DATABASE_NAME:?set canonical Platform application database name}
      RELAY_SERVICE_PRINCIPALS_FILE: /run/secrets/relay-service-principals.json
      RELAY_API_RUNTIME_SECRETS_FILE: /run/secrets/relay-api-runtime-secrets.json
      RELAY_DOWNLOAD_EDGE_RUNTIME_SECRETS_FILE: /run/secrets/relay-download-edge-runtime-secrets.json
      RELAY_PROVIDER_CREDENTIAL_KEYRING_FILE: /run/secrets/relay-provider-credential-keyring
      RELAY_DATABASE_CA_FILE: /run/secrets/relay-database-ca.pem
      RELAY_REDIS_TLS_CA_FILE: /run/secrets/relay-redis-tls-ca.pem
      PLATFORM_DATABASE_CA_FILE: /run/secrets/platform-database-ca.pem
      RELAY_SECRET_ISOLATION_ROLE_ADMIN_SQL_DSN_FILE: /run/secrets/relay-role-admin-dsn
      RELAY_SECRET_ISOLATION_MIGRATION_SQL_DSN_FILE: /run/secrets/relay-migration-sql-dsn
      RELAY_SECRET_ISOLATION_RUNTIME_SQL_DSN_FILE: /run/secrets/relay-runtime-sql-dsn
      RELAY_SECRET_ISOLATION_EDGE_SQL_DSN_FILE: /run/secrets/relay-download-edge-sql-dsn
      RELAY_MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/relay-migration-password
      RELAY_RUNTIME_DATABASE_PASSWORD_FILE: /run/secrets/relay-runtime-password
      RELAY_DOWNLOAD_EDGE_DATABASE_PASSWORD_FILE: /run/secrets/relay-download-edge-password
      PLATFORM_MIGRATION_RUNTIME_SECRETS_FILE: /run/secrets/platform-migration-runtime-secrets.json
      PLATFORM_API_RUNTIME_SECRETS_FILE: /run/secrets/platform-api-runtime-secrets.json
      PLATFORM_DISPATCHER_RUNTIME_SECRETS_FILE: /run/secrets/platform-dispatcher-runtime-secrets.json
      PLATFORM_RELAY_SYNC_RUNTIME_SECRETS_FILE: /run/secrets/platform-relay-sync-runtime-secrets.json
      PLATFORM_TIMEOUT_WORKER_RUNTIME_SECRETS_FILE: /run/secrets/platform-timeout-worker-runtime-secrets.json
      PLATFORM_PUBLISHING_WORKER_RUNTIME_SECRETS_FILE: /run/secrets/platform-publishing-worker-runtime-secrets.json
      PLATFORM_DOWNLOAD_GATEWAY_WORKER_RUNTIME_SECRETS_FILE: /run/secrets/platform-download-gateway-registration-worker-runtime-secrets.json
      PLATFORM_DATABASE_ROLE_ADMIN_DSN_FILE: /run/secrets/platform-role-admin-sql-dsn
      PLATFORM_MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/platform-migration-database-password
      PLATFORM_API_DATABASE_PASSWORD_FILE: /run/secrets/platform-api-database-password
      PLATFORM_DISPATCHER_DATABASE_PASSWORD_FILE: /run/secrets/platform-dispatcher-database-password
      PLATFORM_RELAY_SYNC_DATABASE_PASSWORD_FILE: /run/secrets/platform-relay-sync-database-password
      PLATFORM_TIMEOUT_WORKER_DATABASE_PASSWORD_FILE: /run/secrets/platform-timeout-worker-database-password
      PLATFORM_PUBLISHING_WORKER_DATABASE_PASSWORD_FILE: /run/secrets/platform-publishing-worker-database-password
      PLATFORM_DOWNLOAD_GATEWAY_WORKER_DATABASE_PASSWORD_FILE: /run/secrets/platform-download-gateway-worker-database-password
      RELAY_SECRET_ISOLATION_COMMIT_DIRECTORY: /run/relay-secret-isolation-commit
      RELAY_SECRET_ISOLATION_RECEIPT_PRE_DIRECTORY: /run/relay-secret-isolation/pre
      RELAY_SECRET_ISOLATION_RECEIPT_MIGRATE_DIRECTORY: /run/relay-secret-isolation/migrate
      RELAY_SECRET_ISOLATION_RECEIPT_POST_DIRECTORY: /run/relay-secret-isolation/post
      RELAY_SECRET_ISOLATION_RECEIPT_PRINCIPAL_DIRECTORY: /run/relay-secret-isolation/principal
      RELAY_SECRET_ISOLATION_RECEIPT_API_DIRECTORY: /run/relay-secret-isolation/api
      RELAY_SECRET_ISOLATION_RECEIPT_EDGE_DIRECTORY: /run/relay-secret-isolation/edge
      RELAY_SECRET_ISOLATION_RECEIPT_PLATFORM_MIGRATION_DIRECTORY: /run/relay-secret-isolation/platform-migration
      RELAY_SECRET_ISOLATION_RECEIPT_PLATFORM_API_DIRECTORY: /run/relay-secret-isolation/platform-api
      RELAY_SECRET_ISOLATION_RECEIPT_PLATFORM_DISPATCHER_DIRECTORY: /run/relay-secret-isolation/platform-dispatcher
      RELAY_SECRET_ISOLATION_RECEIPT_PLATFORM_RELAY_SYNC_DIRECTORY: /run/relay-secret-isolation/platform-relay-sync
      RELAY_SECRET_ISOLATION_RECEIPT_PLATFORM_TIMEOUT_WORKER_DIRECTORY: /run/relay-secret-isolation/platform-timeout-worker
      RELAY_SECRET_ISOLATION_RECEIPT_PLATFORM_PUBLISHING_WORKER_DIRECTORY: /run/relay-secret-isolation/platform-publishing-worker
      RELAY_SECRET_ISOLATION_RECEIPT_PLATFORM_DOWNLOAD_GATEWAY_REGISTRATION_WORKER_DIRECTORY: /run/relay-secret-isolation/platform-download-gateway-registration-worker
      RELAY_SECRET_ISOLATION_RECEIPT_PLATFORM_DB_ROLE_PRE_DIRECTORY: /run/relay-secret-isolation/platform-db-role-pre
    volumes: !override
      - type: bind
        source: ${NEW_API_RELAY_DATABASE_CA_FILE:?set owner-only Relay PostgreSQL CA bundle}
        target: /run/secrets/relay-database-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_REDIS_TLS_CA_FILE:?set owner-only Relay Redis TLS CA bundle}
        target: /run/secrets/relay-redis-tls-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_DATABASE_CA_FILE:?set owner-only Platform PostgreSQL CA bundle}
        target: /run/secrets/platform-database-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_ROLE_ADMIN_SQL_DSN_FILE:?set owner-only role-admin PostgreSQL DSN file}
        target: /run/secrets/relay-role-admin-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_MIGRATION_SQL_DSN_FILE:?set owner-only migration PostgreSQL DSN file}
        target: /run/secrets/relay-migration-sql-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_RUNTIME_SQL_DSN_FILE:?set owner-only runtime PostgreSQL DSN file}
        target: /run/secrets/relay-runtime-sql-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RELAY_DOWNLOAD_EDGE_SQL_DSN_FILE:?set owner-only edge PostgreSQL DSN file}
        target: /run/secrets/relay-download-edge-sql-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_MIGRATION_DATABASE_PASSWORD_FILE:?set owner-only migration password file}
        target: /run/secrets/relay-migration-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_RUNTIME_DATABASE_PASSWORD_FILE:?set owner-only runtime password file}
        target: /run/secrets/relay-runtime-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RELAY_DOWNLOAD_EDGE_DATABASE_PASSWORD_FILE:?set owner-only edge password file}
        target: /run/secrets/relay-download-edge-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_SERVICE_PRINCIPALS_FILE:?set owner-only service principal identity file}
        target: /run/secrets/relay-service-principals.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_API_RUNTIME_SECRETS_FILE:?set owner-only API runtime secret file}
        target: /run/secrets/relay-api-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_DOWNLOAD_EDGE_RUNTIME_SECRETS_FILE:?set owner-only edge runtime secret file}
        target: /run/secrets/relay-download-edge-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NEW_API_RELAY_PROVIDER_CREDENTIAL_KEYRING_FILE:?set owner-only provider credential keyring file}
        target: /run/secrets/relay-provider-credential-keyring
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_MIGRATION_RUNTIME_SECRETS_FILE:?set owner-only Platform migration runtime secret file}
        target: /run/secrets/platform-migration-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_API_RUNTIME_SECRETS_FILE:?set owner-only Platform API runtime secret file}
        target: /run/secrets/platform-api-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_DISPATCHER_RUNTIME_SECRETS_FILE:?set owner-only Platform dispatcher runtime secret file}
        target: /run/secrets/platform-dispatcher-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_RELAY_SYNC_RUNTIME_SECRETS_FILE:?set owner-only Platform relay-sync runtime secret file}
        target: /run/secrets/platform-relay-sync-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_TIMEOUT_WORKER_RUNTIME_SECRETS_FILE:?set owner-only Platform timeout-worker runtime secret file}
        target: /run/secrets/platform-timeout-worker-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_PUBLISHING_WORKER_RUNTIME_SECRETS_FILE:?set owner-only Platform publishing-worker runtime secret file}
        target: /run/secrets/platform-publishing-worker-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_DOWNLOAD_GATEWAY_WORKER_RUNTIME_SECRETS_FILE:?set owner-only Platform Download Gateway worker runtime secret file}
        target: /run/secrets/platform-download-gateway-registration-worker-runtime-secrets.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_DATABASE_ROLE_ADMIN_DSN_FILE:?set owner-only Platform role-admin PostgreSQL DSN file}
        target: /run/secrets/platform-role-admin-sql-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_MIGRATION_DATABASE_PASSWORD_FILE:?set owner-only Platform migration password file}
        target: /run/secrets/platform-migration-database-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_API_DATABASE_PASSWORD_FILE:?set owner-only Platform API password file}
        target: /run/secrets/platform-api-database-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_DISPATCHER_DATABASE_PASSWORD_FILE:?set owner-only Platform dispatcher password file}
        target: /run/secrets/platform-dispatcher-database-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_RELAY_SYNC_DATABASE_PASSWORD_FILE:?set owner-only Platform relay-sync password file}
        target: /run/secrets/platform-relay-sync-database-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLATFORM_TIMEOUT_WORKER_DATABASE_PASSWORD_FILE:?set owner-only Platform timeout-worker password file}
        target: /run/secrets/platform-timeout-worker-database-password
        read_only: true
        bind:
          create_host_path: false
