networks:
  platform-api-ingress:
    name: ${PLATFORM_API_INGRESS_NETWORK_NAME:?set a deployment-unique Platform ingress network name}
    driver: bridge
    ipam:
      config:
        - subnet: ${PLATFORM_API_INGRESS_SUBNET:?set a dedicated non-overlapping Platform ingress subnet}
  relay-new-api-managed-state:
    external: true
    name: ${NEW_API_RELAY_MANAGED_STATE_NETWORK:?set pre-created VPC network restricted to managed PostgreSQL and Redis}

volumes:
  relay-new-api-secret-isolation-pre:
  relay-new-api-secret-isolation-migrate:
  relay-new-api-secret-isolation-post:
  relay-new-api-secret-isolation-principal:
  relay-new-api-secret-isolation-api:
  relay-new-api-secret-isolation-edge:
  relay-new-api-secret-isolation-platform-migration:
  relay-new-api-secret-isolation-platform-api:
  relay-new-api-secret-isolation-platform-dispatcher:
  relay-new-api-secret-isolation-platform-relay-sync:
  relay-new-api-secret-isolation-platform-timeout-worker:
  relay-new-api-secret-isolation-platform-publishing-worker:
  relay-new-api-secret-isolation-platform-download-gateway-registration-worker:
  relay-new-api-secret-isolation-platform-db-role-pre:
  relay-new-api-secret-isolation-root-bootstrap:
  relay-new-api-secret-isolation-commit:
  # Permanent release-independent forbidden-root proof. Back up this volume as
  # encrypted deployment state. Never remove it with `docker compose down -v`:
  # the one-time root password is intentionally destroyed after bootstrap and
  # the proof cannot be safely regenerated without that exact source.
  relay-new-api-root-secret-isolation-proof:
  # Non-secret, generation-bound database attestations. The corresponding
  # role-predecessor is the only writer; every later process mounts its proof
  # read-only and verifies it on the same physical PostgreSQL connection.
  relay-new-api-database-release-proof:
  platform-database-release-proof:
