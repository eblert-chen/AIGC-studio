    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
      - /run/platform-database-ca-snapshot:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001
