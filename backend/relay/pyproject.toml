[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-relay"
version = "0.1.0"
description = "Provider-neutral AI media generation relay skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "aiohttp>=3.11,<4",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "aiosqlite>=0.20,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
]

obs = [
  "esdk-obs-python>=3.25,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["relay_service*"]
exclude = ["alembic*", "tests*"]
