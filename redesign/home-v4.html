<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>首页 · 旭天视频工作台</title>
<style>
  @import url("https://fonts.loli.net/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap");

  /* ============ 日览 · 宣纸与朱砂 ============ */
  :root {
    color-scheme: light;
    --paper: #f7f4ec;
    --paper-deep: #efeadd;
    --ink: #211e19;
    --ink-2: #57534a;
    --ink-3: #948e80;
    --hairline: #d8d2c3;
    --hairline-strong: #b9b19e;
    --cinnabar: #b3402a;          /* 朱砂 —— 旭日的颜色 */
    --cinnabar-deep: #96311f;
    --cinnabar-mist: #f0e2da;
  }
  /* ============ 夜览 · 松烟墨 ============ */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #181613;
    --paper-deep: #211e19;
    --ink: #e8e2d4;
    --ink-2: #a89f8d;
    --ink-3: #6d6656;
    --hairline: #35312a;
    --hairline-strong: #4c4639;
    --cinnabar: #e0603f;
    --cinnabar-deep: #ec7757;
    --cinnabar-mist: #332016;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", "Noto Sans SC", "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    font-synthesis: none;
    transition: background 0.2s, color 0.2s;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; color: inherit; }
  ::selection { background: var(--cinnabar-mist); color: var(--cinnabar-deep); }

  .serif { font-family: "Fraunces", "Noto Serif SC", "Songti SC", serif; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  .page { max-width: 1320px; margin: 0 auto; padding: 0 40px; }

  /* ============ 刊头 ============ */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 36px;
    padding: 22px 0 16px;
  }
  .masthead .brand {
    font-family: "Fraunces", "Noto Serif SC", serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .masthead .brand .seal {
    display: inline-grid;
    place-items: center;
    width: 26px; height: 26px;
    margin-right: 10px;
    background: var(--cinnabar);
    color: #fdf9f0;
    font-size: 14px;
    font-weight: 700;
    border-radius: 3px;
    vertical-align: -5px;
  }
  /* 纯文字导航 —— 无图标 */
  .topnav { display: flex; gap: 26px; align-items: baseline; }
  .topnav a {
    font-size: 14px;
    color: var(--ink-2);
    padding-bottom: 3px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s;
  }
  .topnav a:hover { color: var(--ink); }
  .topnav a.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--cinnabar); }
  .masthead .right { margin-left: auto; display: flex; align-items: baseline; gap: 18px; font-size: 13px; color: var(--ink-3); }
  .masthead .right button { font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--hairline-strong); padding-bottom: 1px; }
  .masthead .right button:hover { color: var(--cinnabar); border-color: var(--cinnabar); }

  /* 报纸式双细线 */
  .press-rule { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--hairline); height: 4px; }

  /* ============ 卷首 ============ */
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 7fr) minmax(240px, 3fr);
    gap: 48px;
    padding: 64px 0 44px;
    position: relative;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--cinnabar);
    font-weight: 600;
    margin-bottom: 22px;
  }
  .kicker .mono { color: var(--ink-3); letter-spacing: 0.1em; margin-left: 10px; }
  .hero h1 {
    font-family: "Fraunces", "Noto Serif SC", serif;
    font-size: clamp(40px, 5.4vw, 68px);
    font-weight: 700;
    line-height: 1.16;
    letter-spacing: 0.005em;
  }
  .hero h1 em { font-style: normal; color: var(--cinnabar); }
  .hero .lead {
    margin-top: 26px;
    max-width: 470px;
    font-size: 16px;
    color: var(--ink-2);
    line-height: 1.8;
  }
  /* 右侧：竖排刊名 + 数据栏 */
  .hero-aside { display: flex; gap: 28px; justify-content: flex-end; }
  .vertical-title {
    writing-mode: vertical-rl;
    font-family: "Noto Serif SC", serif;
    font-size: 15px;
    letter-spacing: 0.5em;
    color: var(--ink-3);
    padding-top: 6px;
    user-select: none;
  }
  .hero-stats { align-self: flex-end; width: 100%; max-width: 230px; }
  .stat-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-top: 1px solid var(--hairline);
  }
  .stat-line:last-child { border-bottom: 1px solid var(--hairline); }
  .stat-line .k { font-size: 13px; color: var(--ink-2); }
  .stat-line .v { font-family: "Fraunces", "Noto Serif SC", serif; font-size: 24px; font-weight: 600; }
  .stat-line .v small { font-size: 12px; color: var(--ink-3); font-family: "Inter", "Noto Sans SC", sans-serif; margin-left: 2px; }

  /* ============ 创作刊带 —— 不是悬浮胶囊 ============ */
  .composer-band {
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--hairline);
    padding: 20px 0;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 26px;
    align-items: center;
  }
  .composer-band .cb-label {
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
  }
  .composer-band .cb-label::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--cinnabar);
    margin-right: 10px;
    vertical-align: 2px;
  }
  .composer-band input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 15.5px;
    width: 100%;
    border-bottom: 1px solid var(--hairline);
    padding: 6px 2px;
    transition: border-color 0.15s;
  }
  .composer-band input:focus { border-bottom-color: var(--cinnabar); }
  .composer-band input::placeholder { color: var(--ink-3); }
  .composer-band .cb-model { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .composer-band .cb-go {
    font-size: 15px;
    font-weight: 600;
    color: var(--cinnabar);
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .composer-band .cb-go:hover { color: var(--cinnabar-deep); }

  /* ============ 精选栏目标头 ============ */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    padding: 46px 0 26px;
  }
  .section-head h2 {
    font-family: "Fraunces", "Noto Serif SC", serif;
    font-size: 27px;
    font-weight: 700;
  }
  .section-head h2 .mono { font-size: 13px; color: var(--ink-3); font-weight: 400; margin-left: 12px; letter-spacing: 0.08em; }
  /* 文字过滤器 —— 不是药丸 */
  .filter { display: flex; gap: 4px; font-size: 14px; color: var(--ink-3); }
  .filter button { color: var(--ink-3); padding: 2px 2px; }
  .filter button:hover { color: var(--ink); }
  .filter button.on { color: var(--cinnabar); font-weight: 600; }
  .filter .sep { margin: 0 8px; color: var(--hairline-strong); }

  /* ============ 画廊 —— 无卡片 ============ */
  .gallery {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 40px 24px;
    padding-bottom: 90px;
  }
  .piece { cursor: pointer; }
  .piece .frame { overflow: hidden; background: var(--paper-deep); }
  .piece img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.2, 0.6, 0.2, 1), filter 0.3s; }
  .piece:hover img { transform: scale(1.025); }
  /* 图注在图下方 —— 画廊/杂志惯例 */
  .piece figcaption { padding-top: 12px; border-top: 1px solid var(--hairline); margin-top: 12px; }
  .piece .idx {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--cinnabar);
  }
  .piece .pt {
    font-family: "Fraunces", "Noto Serif SC", serif;
    font-size: 16.5px;
    font-weight: 600;
    line-height: 1.5;
    margin-top: 5px;
  }
  .piece .pa { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; display: flex; justify-content: space-between; align-items: baseline; }
  .piece .pa .do {
    color: var(--ink-3);
    font-size: 12.5px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .piece:hover .pa .do { opacity: 1; }
  .piece .pa .do:hover { color: var(--cinnabar); }

  /* 编辑网格：刻意的不对称 */
  .p-1 { grid-column: span 3; } .p-1 .frame { aspect-ratio: 16/10; }
  .p-2 { grid-column: span 3; padding-top: 72px; } .p-2 .frame { aspect-ratio: 4/3; }
  .p-3 { grid-column: span 2; } .p-3 .frame { aspect-ratio: 3/4; }
  .p-4 { grid-column: span 2; padding-top: 48px; } .p-4 .frame { aspect-ratio: 1/1; }
  .p-5 { grid-column: span 2; padding-top: 96px; } .p-5 .frame { aspect-ratio: 3/4; }
  .p-6 { grid-column: span 3; } .p-6 .frame { aspect-ratio: 16/10; }
  .p-7 { grid-column: span 3; padding-top: 60px; } .p-7 .frame { aspect-ratio: 4/3; }
  .p-8 { grid-column: span 2; } .p-8 .frame { aspect-ratio: 3/4; }
  .p-9 { grid-column: span 2; padding-top: 44px; } .p-9 .frame { aspect-ratio: 4/5; }
  .p-10 { grid-column: span 2; padding-top: 88px; } .p-10 .frame { aspect-ratio: 3/4; }

  /* 行间引言 —— 杂志的节奏感 */
  .pull-quote {
    grid-column: span 6;
    text-align: center;
    padding: 44px 0 20px;
  }
  .pull-quote p {
    font-family: "Noto Serif SC", serif;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.7;
    color: var(--ink-2);
    max-width: 620px;
    margin: 0 auto;
  }
  .pull-quote .from { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; letter-spacing: 0.14em; }

  /* 页脚 */
  .colophon {
    border-top: 1px solid var(--ink);
    padding: 22px 0 34px;
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }

  @media (max-width: 900px) {
    .page { padding: 0 20px; }
    .masthead { flex-wrap: wrap; gap: 14px 22px; }
    .hero { grid-template-columns: 1fr; padding: 44px 0 32px; }
    .vertical-title { display: none; }
    .composer-band { grid-template-columns: 1fr; gap: 14px; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 32px 16px; }
    .gallery .piece, .gallery .pull-quote { grid-column: span 2 !important; padding-top: 0 !important; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 刊头 -->
  <header class="masthead">
    <a class="brand" href="#"><span class="seal">旭</span>旭天 · 视频工作台</a>
    <nav class="topnav">
      <a class="on" href="#">首页</a>
      <a href="#">创作</a>
      <a href="#">素材</a>
      <a href="#">作品</a>
      <a href="#">发布</a>
      <a href="#">控制台</a>
    </nav>
    <div class="right">
      <span class="mono num">2026.08.13</span>
      <button id="skinBtn">夜览</button>
      <button>充值</button>
    </div>
  </header>
  <div class="press-rule"></div>

  <!-- 卷首 -->
  <section class="hero">
    <div>
      <div class="kicker">灵感志<span class="mono">ISSUE No.214 · 每周四更新</span></div>
      <h1>好的画面，<br /><em>先在心里</em>，再在工具里。</h1>
      <p class="lead">这里汇集社区本周最值得看的生成作品。每一张都公开完整的提示词与参数——看上哪一张，直接做成你的同款。</p>
    </div>
    <div class="hero-aside">
      <div class="hero-stats">
        <div class="stat-line"><span class="k">今日新作</span><span class="v num">1,284<small>张</small></span></div>
        <div class="stat-line"><span class="k">在线模型</span><span class="v num">3<small>个</small></span></div>
        <div class="stat-line"><span class="k">本周成功率</span><span class="v num">96.4<small>%</small></span></div>
      </div>
      <div class="vertical-title">灵感志 · 旭天</div>
    </div>
  </section>

  <!-- 创作刊带 -->
  <div class="composer-band">
    <span class="cb-label">开始创作</span>
    <input placeholder="描述你想要的画面：晨光里的雪山，镜头缓慢推近……" />
    <span class="cb-model">CinemoX Pro 2.1 · 8s · 1080p</span>
    <button class="cb-go">生成 →</button>
  </div>

  <!-- 栏目头 -->
  <div class="section-head">
    <h2>今日精选<span class="mono num">/ 08.13</span></h2>
    <div class="filter">
      <button class="on">全部</button><span class="sep">·</span>
      <button>视频</button><span class="sep">·</span>
      <button>图片</button><span class="sep">·</span>
      <button>模板</button><span class="sep">·</span>
      <button>挑战</button>
    </div>
  </div>

  <!-- 画廊 -->
  <section class="gallery" id="gallery"></section>

  <!-- 页脚 -->
  <footer class="colophon">
    <span>旭天 · 视频工作台 —— 灵感志编辑部</span>
    <span>演示模式 · 素材为项目自有</span>
  </footer>
</div>

<script>
  /* 日览 / 夜览 */
  const root = document.documentElement;
  const saved = localStorage.getItem("xt-skin-v4");
  if (saved) root.dataset.theme = saved;
  const btn = document.getElementById("skinBtn");
  const sync = () => (btn.textContent = root.dataset.theme === "dark" ? "日览" : "夜览");
  sync();
  btn.addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "" : "dark";
    localStorage.setItem("xt-skin-v4", root.dataset.theme);
    sync();
  });

  const works = [
    { cls: "p-1",  img: "../public/community/community-hero.png",        t: "薄雾山谷的清晨，第一缕光越过山脊", a: "@mistwalker",  k: "视频" },
    { cls: "p-2",  img: "../public/community/ice-landscape.png",         t: "极地冰原，蓝调时刻",              a: "@northlight",  k: "图片" },
    { cls: "p-3",  img: "../public/community/blue-editorial-portrait.png", t: "蓝色编辑部人像",                a: "@studio_k",    k: "图片" },
    { cls: "p-4",  img: "../public/community/cyber-fashion-portrait.png",  t: "赛博时装：霓虹与金属",          a: "@neon.chen",   k: "模板" },
    { cls: "p-5",  img: "../public/community/miniature-fashion.png",       t: "微缩世界的时装秀",              a: "@tinyworld",   k: "视频" },
    { cls: "p-6",  img: "../public/community/neon-anime-street.png",       t: "雨后霓虹街道，新海诚色调",      a: "@ame.anime",   k: "挑战" },
    { quote: true },
    { cls: "p-7",  img: "../public/media/speaker-water-hero.png",          t: "水面悬浮的音箱，慢镜头涟漪",    a: "@productlab",  k: "视频" },
    { cls: "p-8",  img: "../public/media/scene-indoor.png",                t: "室内自然光，柔和日常",          a: "@dailylight",  k: "图片" },
    { cls: "p-9",  img: "../public/media/scene-hand-rain.png",             t: "掌心接住的雨",                  a: "@rainpoet",    k: "视频" },
    { cls: "p-10", img: "../public/media/scene-lifestyle.png",             t: "暖调午后，生活方式随拍",        a: "@warmtone",    k: "图片" },
  ];

  let idx = 0;
  document.getElementById("gallery").innerHTML = works
    .map((w) => {
      if (w.quote) {
        return `<div class="pull-quote"><p>「工具从不缺位，<br />缺的是值得被生成的东西。」</p><div class="from">—— 本周挑战 · 评审寄语</div></div>`;
      }
      idx += 1;
      const no = String(idx).padStart(3, "0");
      return `<figure class="piece ${w.cls}">
        <div class="frame"><img src="${w.img}" alt="${w.t}" loading="lazy" /></div>
        <figcaption>
          <span class="idx">No.${no} / ${w.k}</span>
          <div class="pt">${w.t}</div>
          <div class="pa"><span>${w.a}</span><button class="do">做同款 →</button></div>
        </figcaption>
      </figure>`;
    })
    .join("");
</script>
</body>
</html>
